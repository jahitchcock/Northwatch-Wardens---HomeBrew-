<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DM Panel — Northwatch Wardens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="style.css">
  <style>
    #panel-tracker {
      position: absolute;
      inset: 0;
      flex-direction: column;
      overflow: hidden;
      background: #1a1a1a;
      z-index: 1;
      display: none;
    }
    #panel-tracker:not([hidden]) {
      display: flex;
    }
    #tracker-subnav {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px 12px;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .tr-tab {
      background: none;
      border: 1px solid transparent;
      color: #888;
      font-family: inherit;
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: 0.03em;
    }
    .tr-tab:hover { color: #ccc; background: #1e1e1e; }
    .tr-tab.active { color: #f5f0e8; border-color: #444; background: #2a2a2a; }
    #tracker-saved {
      margin-left: auto;
      font-size: 11px;
      color: #558855;
      font-family: sans-serif;
    }
    #tracker-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 28px;
      color: #cdd6f4;
      font-family: 'Palatino Linotype', Palatino, serif;
    }
    .tr-section { max-width: 900px; }
    .tr-section h2 {
      font-size: 1.1em; font-weight: normal; color: #f5f0e8;
      border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 16px;
    }
    .tr-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
    .tr-table th {
      text-align: left; padding: 6px 10px; background: #222;
      color: #888; font-weight: normal; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .tr-table td { padding: 6px 10px; border-bottom: 1px solid #222; }
    .tr-table td input, .tr-table td select, .tr-table td textarea {
      background: transparent; border: none; color: #cdd6f4;
      font-family: inherit; font-size: 13px; width: 100%;
      outline: none; padding: 0;
    }
    .tr-table td input:focus, .tr-table td select:focus, .tr-table td textarea:focus {
      background: #222; border-radius: 2px; padding: 2px 4px;
    }
    .tr-table td select { cursor: pointer; }
    select option { background: #1a1a1a; }
    .tr-contract { margin-bottom: 24px; }
    .tr-contract-title {
      font-size: 1em; color: #f5f0e8; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid #2a2a2a;
      user-select: none;
    }
    .tr-contract-title .arrow { font-size: 10px; color: #666; transition: transform 0.15s; }
    .tr-contract-title.open .arrow { transform: rotate(90deg); }
    .tr-contract-body { padding: 12px 0 0 0; display: none; }
    .tr-contract-body.open { display: block; }
    .tr-checklist { list-style: none; padding: 0; margin: 0 0 12px 0; }
    .tr-checklist li {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 13px; cursor: pointer;
      color: #aaa;
    }
    .tr-checklist li.checked { color: #cdd6f4; text-decoration: none; }
    .tr-checklist li input[type=checkbox] { cursor: pointer; accent-color: #58180d; flex-shrink: 0; }
    .tr-notes {
      width: 100%; min-height: 60px; background: #161616;
      border: 1px solid #2a2a2a; border-radius: 3px;
      color: #cdd6f4; font-family: inherit; font-size: 13px;
      padding: 8px 10px; resize: vertical; margin-top: 8px;
      box-sizing: border-box;
    }
    .tr-notes:focus { outline: 1px solid #444; }
    .tr-add-btn {
      background: none; border: 1px dashed #444; color: #666;
      font-family: inherit; font-size: 12px; padding: 4px 12px;
      cursor: pointer; border-radius: 3px; margin-top: 8px;
    }
    .tr-add-btn:hover { border-color: #888; color: #aaa; }
    .tr-remove-btn {
      background: none; border: none; color: #555; cursor: pointer;
      font-size: 14px; padding: 0 4px; line-height: 1;
    }
    .tr-remove-btn:hover { color: #f38ba8; }
    .tr-gold-row { display: flex; gap: 24px; margin-bottom: 20px; align-items: center; font-size: 13px; }
    .tr-gold-row label { color: #888; }
    .tr-gold-row input {
      background: #161616; border: 1px solid #2a2a2a; border-radius: 3px;
      color: #cdd6f4; font-family: inherit; font-size: 13px;
      padding: 4px 8px; width: 120px;
    }
    .tr-session-list { list-style: none; padding: 0; margin: 0 0 16px 0; }
    .tr-session-item {
      padding: 10px 14px; border: 1px solid #2a2a2a; border-radius: 4px;
      margin-bottom: 8px; cursor: pointer; font-size: 13px;
    }
    .tr-session-item:hover { border-color: #444; background: #1e1e1e; }
    .tr-session-item .session-meta { color: #888; font-size: 11px; margin-bottom: 2px; }
    .tr-session-item .session-preview { color: #aaa; }
    .tr-session-form { border: 1px solid #333; border-radius: 4px; padding: 16px; margin-bottom: 16px; }
    .tr-session-form label { display: block; color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; margin-top: 12px; }
    .tr-session-form label:first-child { margin-top: 0; }
    .tr-session-form input, .tr-session-form textarea {
      width: 100%; background: #161616; border: 1px solid #2a2a2a;
      border-radius: 3px; color: #cdd6f4; font-family: inherit;
      font-size: 13px; padding: 6px 10px; box-sizing: border-box;
    }
    .tr-session-form textarea { min-height: 100px; resize: vertical; }
    .tr-session-save {
      background: #58180d; color: #f5f0e8; border: none;
      padding: 7px 18px; font-family: inherit; font-size: 13px;
      cursor: pointer; border-radius: 3px; margin-top: 12px;
    }
    .tr-session-save:hover { background: #7a2010; }

    /* ── Party Modal ──────────────────────────────────────────── */
    .pc-tabs { display:flex; gap:4px; padding:12px 16px 0; border-bottom:1px solid #c9ad6a; background:#f4e8c1; flex-shrink:0; }
    .pc-tab { background:none; border:none; border-bottom:3px solid transparent; color:#7a6050; font-family:'Palatino Linotype',Palatino,serif; font-size:13px; padding:6px 14px 8px; cursor:pointer; transition:color 0.15s; }
    .pc-tab:hover { color:#3b0d0d; }
    .pc-tab.active { color:#3b0d0d; border-bottom-color:#58180d; font-weight:bold; }
    .pc-scroll { flex:1; overflow-y:auto; background:#f4e8c1; }
    .pc-sheet { padding:20px 24px; max-width:900px; color:#2c1810; font-family:'Palatino Linotype',Palatino,serif; }
    .pc-header { margin-bottom:16px; border-bottom:3px solid #c9ad6a; padding-bottom:12px; }
    .pc-name { font-size:1.5em; color:#58180d; text-transform:uppercase; letter-spacing:1px; font-weight:bold; display:flex; align-items:center; gap:10px; }
    .pc-companion-badge { font-size:0.5em; background:#58180d; color:#f5f0e8; padding:2px 8px; border-radius:3px; letter-spacing:0.05em; vertical-align:middle; }
    .pc-meta { font-size:0.9em; color:#7a6050; margin-top:4px; }
    .pc-body { display:grid; grid-template-columns:160px 1fr 160px; gap:20px; }
    .pc-abilities { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:16px; }
    .pc-ability { border:2px solid #c9ad6a; border-radius:6px; text-align:center; padding:6px 4px; background:#ede8da; }
    .pc-ability-name { font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:#7a6050; }
    .pc-ability-mod { font-size:1.3em; font-weight:bold; color:#3b0d0d; line-height:1.1; }
    .pc-ability-score { font-size:10px; color:#7a6050; }
    .pc-section { margin-bottom:14px; }
    .pc-section-title { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:#7a6050; border-bottom:1px solid #c9ad6a; padding-bottom:2px; margin-bottom:6px; }
    .pc-combat { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:16px; }
    .pc-combat-stat { border:2px solid #c9ad6a; border-radius:4px; text-align:center; padding:6px 4px; background:#ede8da; }
    .pc-cs-label { font-size:9px; text-transform:uppercase; letter-spacing:0.06em; color:#7a6050; }
    .pc-cs-value { font-size:1.2em; font-weight:bold; color:#3b0d0d; }
    .pc-saves { display:flex; flex-wrap:wrap; gap:6px; }
    .pc-save { background:#ede8da; border:1px solid #c9ad6a; border-radius:3px; padding:2px 8px; font-size:12px; color:#3b0d0d; }
    .pc-def-row, .pc-prof-row, .pc-passive-row { font-size:12px; margin-bottom:3px; color:#2c1810; }
    .pc-def-label { font-weight:bold; color:#58180d; font-size:10px; text-transform:uppercase; }
    .pc-lang { font-size:12px; color:#2c1810; }
    .pc-skills-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; }
    .pc-skill { font-size:11px; display:flex; align-items:center; gap:5px; padding:2px 0; color:#2c1810; }
    .pc-skill-mod { font-weight:bold; color:#3b0d0d; min-width:26px; text-align:right; font-size:12px; }
    .pc-attacks { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:4px; }
    .pc-attacks th { background:#58180d; color:#f5f0e8; padding:5px 8px; text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; }
    .pc-attacks td { padding:5px 8px; border-bottom:1px solid #ddd; }
    .pc-attacks tr:nth-child(even) td { background:#ede8da; }
    .pc-feature { margin-bottom:10px; }
    .pc-feature-name { font-weight:bold; color:#3b0d0d; font-size:13px; }
    .pc-feature-sub { font-weight:normal; font-size:11px; color:#7a6050; }
    .pc-feature-desc { font-size:12px; color:#2c1810; margin-top:3px; line-height:1.5; }
    .link-5e-inline { color:#58180d !important; text-decoration:underline; cursor:pointer; }
    @media (max-width:700px) {
      .pc-body { grid-template-columns:1fr; }
      .pc-col-right { order:-1; }
    }

    /* ── Combat Tracker Modal ────────────────────────────────── */
    .ct-wrap { display:flex; flex-direction:column; height:100%; font-family:'Segoe UI',sans-serif; background:#111; color:#cdd6f4; }
    .ct-header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#0d0d0d; border-bottom:1px solid #2a2a2a; flex-shrink:0; }
    .ct-round { font-size:13px; color:#888; }
    .ct-round strong { color:#cdd6f4; font-size:16px; }
    .ct-next-btn { background:#58180d; color:#f5f0e8; border:none; padding:5px 14px; border-radius:3px; cursor:pointer; font-size:12px; font-weight:600; }
    .ct-next-btn:hover { background:#7a2010; }
    .ct-reset-btn { margin-left:auto; background:none; border:1px solid #333; color:#666; padding:4px 10px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-reset-btn:hover { border-color:#f38ba8; color:#f38ba8; }
    .ct-list { flex:1; overflow-y:auto; padding:8px 0; }
    .ct-row {
      display:grid; grid-template-columns:40px 1fr 52px 120px auto;
      align-items:center; gap:0; padding:6px 16px;
      border-left:3px solid transparent; transition:background 0.1s;
    }
    .ct-row:hover { background:#1a1a1a; }
    .ct-row.ct-active { border-left-color:#cba6f7; background:#1a1a2a; }
    .ct-row.ct-dead { opacity:0.4; }
    .ct-init { font-size:18px; font-weight:700; color:#cba6f7; text-align:center; cursor:pointer; border:none; background:none; width:36px; padding:0; font-family:'Segoe UI',sans-serif; }
    .ct-init:focus { outline:1px solid #444; border-radius:2px; }
    .ct-name { font-size:13px; color:#f5f0e8; cursor:pointer; padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ct-name:focus { outline:1px solid #444; border-radius:2px; background:#222; padding:0 4px; }
    .ct-ac { font-size:12px; color:#888; text-align:center; cursor:pointer; border:none; background:none; width:44px; font-family:'Segoe UI',sans-serif; }
    .ct-ac:focus { outline:1px solid #444; border-radius:2px; background:#222; }
    .ct-hp-ctrl { display:flex; align-items:center; gap:4px; }
    .ct-hp-btn { background:#1e1e2e; border:1px solid #333; color:#cdd6f4; width:22px; height:22px; border-radius:3px; cursor:pointer; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ct-hp-btn:hover { background:#2a2a3a; }
    .ct-hp-cur { width:36px; text-align:center; background:none; border:none; color:#a6e3a1; font-size:14px; font-weight:700; font-family:'Segoe UI',sans-serif; cursor:pointer; }
    .ct-hp-cur:focus { outline:1px solid #444; border-radius:2px; background:#222; }
    .ct-hp-sep { color:#444; font-size:11px; }
    .ct-hp-max { width:32px; text-align:center; background:none; border:none; color:#888; font-size:12px; font-family:'Segoe UI',sans-serif; cursor:pointer; }
    .ct-hp-max:focus { outline:1px solid #444; border-radius:2px; background:#222; }
    .ct-hp-cur[data-low="true"] { color:#f38ba8; }
    .ct-actions { display:flex; align-items:center; gap:6px; padding-left:8px; }
    .ct-cond-wrap { display:flex; flex-wrap:wrap; gap:3px; padding:2px 16px 4px 58px; }
    .ct-cond { font-size:10px; background:#2a1a1a; border:1px solid #58180d; color:#f38ba8; border-radius:2px; padding:1px 6px; cursor:pointer; }
    .ct-cond:hover { background:#3a1a1a; }
    .ct-cond-btn { background:none; border:1px dashed #333; color:#555; font-size:10px; border-radius:2px; padding:1px 6px; cursor:pointer; }
    .ct-cond-btn:hover { border-color:#666; color:#888; }
    .ct-remove-btn { background:none; border:none; color:#444; cursor:pointer; font-size:16px; line-height:1; padding:0 2px; }
    .ct-remove-btn:hover { color:#f38ba8; }
    .ct-add-form { display:flex; align-items:center; gap:6px; padding:10px 16px; background:#0d0d0d; border-top:1px solid #2a2a2a; flex-shrink:0; flex-wrap:wrap; }
    .ct-add-form input { background:#1a1a1a; border:1px solid #333; color:#cdd6f4; border-radius:3px; padding:5px 8px; font-size:12px; font-family:'Segoe UI',sans-serif; }
    .ct-add-form input:focus { outline:1px solid #cba6f7; }
    .ct-add-form input[name=name] { flex:1; min-width:100px; }
    .ct-add-form input[name=init] { width:48px; }
    .ct-add-form input[name=ac]   { width:44px; }
    .ct-add-form input[name=hp]   { width:52px; }
    .ct-add-form label { font-size:10px; color:#666; text-transform:uppercase; letter-spacing:0.05em; }
    .ct-type-sel { background:#1a1a1a; border:1px solid #333; color:#cdd6f4; border-radius:3px; padding:5px 6px; font-size:12px; cursor:pointer; }
    .ct-add-submit { background:#313244; border:none; color:#cdd6f4; padding:5px 14px; border-radius:3px; cursor:pointer; font-size:12px; }
    .ct-add-submit:hover { background:#45475a; }
    .ct-empty { padding:40px; text-align:center; color:#555; font-size:13px; }
    .ct-save-btn { background:#1e3a1e; color:#a6e3a1; border:1px solid #2a4a2a; padding:4px 11px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-save-btn:hover { background:#2a4a2a; }
    .ct-load-btn { background:#1a1a2e; color:#cba6f7; border:1px solid #2a2a4a; padding:4px 11px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-load-btn:hover { background:#2a2a4a; }
    .ct-save-bar { display:flex; align-items:center; gap:6px; padding:8px 16px; background:#0a0a0a; border-top:1px solid #2a2a2a; flex-shrink:0; }
    .ct-save-bar input { flex:1; background:#1a1a1a; border:1px solid #333; color:#cdd6f4; border-radius:3px; padding:5px 10px; font-size:12px; font-family:'Segoe UI',sans-serif; }
    .ct-save-bar input:focus { outline:1px solid #a6e3a1; }
    .ct-save-confirm { background:#1e3a1e; color:#a6e3a1; border:1px solid #2a4a2a; padding:5px 12px; border-radius:3px; cursor:pointer; font-size:12px; }
    .ct-save-confirm:hover { background:#2a4a2a; }
    .ct-save-cancel { background:none; border:none; color:#555; cursor:pointer; font-size:16px; padding:0 4px; }
    .ct-save-cancel:hover { color:#f38ba8; }
    .ct-saved-msg { font-size:11px; color:#a6e3a1; margin-left:4px; }
    .ct-enc-list { list-style:none; padding:0; margin:0; }
    .ct-enc-item { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid #1a1a1a; }
    .ct-enc-item:hover { background:#1a1a1a; }
    .ct-enc-name { flex:1; font-size:13px; color:#cdd6f4; }
    .ct-enc-date { font-size:11px; color:#555; }
    .ct-enc-load { background:#1a1a2e; color:#cba6f7; border:1px solid #2a2a4a; padding:4px 10px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-enc-load:hover { background:#2a2a4a; }
    .ct-enc-del { background:none; border:none; color:#444; cursor:pointer; font-size:15px; padding:0 2px; }
    .ct-enc-del:hover { color:#f38ba8; }
    .ct-import-panel { background:#0d0d0d; border-top:1px solid #2a2a2a; flex-shrink:0; max-height:240px; overflow-y:auto; }
    .ct-import-hdr { display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid #1a1a1a; position:sticky; top:0; background:#0d0d0d; z-index:1; }
    .ct-import-hdr span { font-size:11px; color:#666; text-transform:uppercase; letter-spacing:0.05em; flex:1; }
    .ct-import-add-all { background:#313244; border:none; color:#cdd6f4; padding:4px 10px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-import-add-all:hover { background:#45475a; }
    .ct-import-row { display:flex; align-items:center; gap:8px; padding:6px 16px; border-bottom:1px solid #1a1a1a; }
    .ct-import-row:hover { background:#111; }
    .ct-import-name { flex:1; font-size:12px; color:#cdd6f4; }
    .ct-import-stats { font-size:11px; color:#666; white-space:nowrap; }
    .ct-import-count { width:36px; background:#1a1a1a; border:1px solid #333; color:#cdd6f4; border-radius:3px; padding:2px 4px; font-size:12px; text-align:center; }
    .ct-import-btn { background:#1a1a2e; color:#cba6f7; border:1px solid #2a2a4a; padding:3px 9px; border-radius:3px; cursor:pointer; font-size:11px; white-space:nowrap; }
    .ct-import-btn:hover { background:#2a2a4a; }
    .ct-from-adv-btn { background:#1a1a2e; color:#cba6f7; border:1px solid #2a2a4a; padding:5px 11px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-from-adv-btn:hover { background:#2a2a4a; }
    .ct-from-adv-btn[hidden] { display:none; }
    .ct-cond-picker { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px 6px 58px; background:#161616; border-top:1px solid #1e1e1e; }
    .ct-cond-opt { font-size:10px; background:none; border:1px solid #333; color:#666; border-radius:2px; padding:2px 7px; cursor:pointer; }
    .ct-cond-opt:hover { border-color:#888; color:#aaa; }
    .ct-cond-opt.selected { background:#2a1a1a; border-color:#58180d; color:#f38ba8; }
  </style>
</head>
<body>

  <header id="tabbar">
    <!-- Mobile-only drawer toggles — grouped at start so they're always visible without scrolling -->
    <button class="mob-btn" id="mob-files" aria-label="Toggle file browser">☰</button>
    <button class="mob-btn" id="mob-term" aria-label="Toggle terminal">⌨</button>

    <nav class="tab-group">
      <button class="tab" data-path="gm-lore/welcome.md">Home</button>
      <button class="tab" id="tab-tracker" data-tab="tracker">Tracker</button>
      <button class="tab" id="tab-party" data-tab="party">Party</button>
      <button class="tab" data-path="adventures">Adventures</button>
      <button class="tab" data-path="npcs">NPCs</button>
      <button class="tab" data-path="locations">Locations</button>
      <button class="tab" id="tab-combat-tracker" data-tab="combat-tracker">Combat Tracker</button>
      <button class="tab" data-path="homebrew">Homebrew</button>
      <div id="tools-wrap">
        <button id="btn-tools">Tools ▾</button>
      </div>
    </nav>

    <div id="search-wrap">
      <input id="search-input" type="search" placeholder="Search files…" autocomplete="off" spellcheck="false">
    </div>

    <div id="season-wrap">
      <label for="season-sel">Season</label>
      <select id="season-sel">
        <option value="">All</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>

    <div id="breadcrumb" title="Current path"></div>
    <button id="btn-ctx" title="Send file path to terminal" hidden>⌨ Path</button>
    <button id="btn-manifest" title="Edit MANIFEST.md for current directory" hidden>✎ Manifest</button>
    <button id="btn-print" title="Print this handout" hidden>🖨 Print</button>

    <div id="toast" aria-live="polite"></div>
  </header>

  <!-- Tools dropdown (body-level so it escapes tabbar overflow clipping) -->
  <div id="tools-dropdown" hidden>
    <div class="tools-section">
      <div class="tools-section-label">World Tables</div>
      <div id="tools-world-tables">
        <div class="tool-item" style="color:var(--subtext);cursor:default;font-style:italic">Loading…</div>
      </div>
    </div>
    <div class="tools-section">
      <div class="tools-section-label">SRD Tools</div>
      <button id="tool-random-encounter" class="tool-item">⚔ Random Encounter</button>
      <button id="tool-treasure-hoard" class="tool-item">💰 Treasure Hoard</button>
    </div>
    <div class="tools-section">
      <div class="tools-section-label">5etools</div>
      <button class="tool-item tool-5e" data-5e-path="">🎲 5etools</button>
      <button class="tool-item tool-5e" data-5e-path="bestiary.html">🐉 Bestiary</button>
      <button class="tool-item tool-5e" data-5e-path="spells.html">✨ Spells</button>
    </div>
  </div>

  <!-- Backdrop for mobile drawers -->
  <div id="drawer-backdrop"></div>

  <div id="workspace">

    <aside id="panel-left">
      <div class="panel-hdr">Files</div>
      <div id="file-tree"></div>
    </aside>

    <div class="rh" id="rh-l" title="Drag to resize · click ‹ to collapse">
      <button class="cbt" id="cbt-l" aria-label="Toggle file browser">‹</button>
    </div>

    <main id="panel-center">
      <iframe id="viewer" src="about:blank" title="Content viewer"></iframe>
      <div id="panel-tracker" hidden>
        <nav id="tracker-subnav">
          <button class="tr-tab active" data-section="contracts">Contracts</button>
          <button class="tr-tab" data-section="party">Party</button>
          <button class="tr-tab" data-section="npcs">NPCs</button>
          <button class="tr-tab" data-section="clues">Echo</button>
          <button class="tr-tab" data-section="promises">Promises</button>
          <button class="tr-tab" data-section="treasure">Treasure</button>
          <button class="tr-tab" data-section="sessions">Sessions</button>
          <span id="tracker-saved"></span>
        </nav>
        <div id="tracker-content"></div>
      </div>
    </main>

    <div class="rh" id="rh-r" title="Drag to resize · click › to collapse">
      <button class="cbt" id="cbt-r" aria-label="Toggle terminal">›</button>
    </div>

    <aside id="panel-right">
      <div class="panel-hdr">Terminal</div>
      <div id="term-wrap"></div>
    </aside>

  </div>

  <!-- Modal overlay (primary) -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title"></span>
        <button class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- Modal overlay (nested, max 2 deep) -->
  <div id="modal2" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title"></span>
        <button class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="app.js"></script>
  <script src="sounds.js"></script>

  <!-- Hidden audio elements for crossfade -->
  <audio id="snd-a"></audio>
  <audio id="snd-b"></audio>

  <!-- Ambient sound bar -->
  <div id="sound-bar">
    <span id="snd-icon">♪</span>
    <span id="snd-name">— stopped —</span>
    <button id="snd-play">▶ Play</button>
    <button id="snd-loop" title="Loop">⟳</button>
    <div id="snd-quick"></div>
    <span id="snd-suggest-label" hidden>suggested for this file</span>
    <div id="snd-vol-wrap">
      <span>🔊</span>
      <input id="snd-vol" type="range" min="0" max="100" value="70">
    </div>
  </div>
</body>
</html>
