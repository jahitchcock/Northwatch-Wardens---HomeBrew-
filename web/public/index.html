<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DM Panel — Northwatch Wardens</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <script>
    (function () {
      var T = {
        mocha:     { '--bg':'#1e1e2e','--panel':'#181825','--overlay':'#313244','--text':'#cdd6f4','--subtext':'#a6adc8','--accent':'#cba6f7','--border':'#45475a','--red':'#f38ba8' },
        tavern:    { '--bg':'#1a1208','--panel':'#140e06','--overlay':'#2e2010','--text':'#f0e0c0','--subtext':'#b89060','--accent':'#d4a849','--border':'#4a3820','--red':'#d45a3a' },
        midnight:  { '--bg':'#0a0a0f','--panel':'#060608','--overlay':'#141420','--text':'#e8f0ff','--subtext':'#8898cc','--accent':'#5b8fff','--border':'#1e2a44','--red':'#ff4d6a' },
        forest:    { '--bg':'#0e1a10','--panel':'#0a1209','--overlay':'#1a2e1c','--text':'#c8dcc8','--subtext':'#7a9e7a','--accent':'#5cba6c','--border':'#2a4a2e','--red':'#d45a5a' },
        arcane:    { '--bg':'#0d0a1a','--panel':'#080612','--overlay':'#1a1430','--text':'#c8d8f0','--subtext':'#7a88c8','--accent':'#48d0c8','--border':'#2a2050','--red':'#f05080' },
        parchment: { '--bg':'#f0e8d0','--panel':'#e8ddc0','--overlay':'#d8c8a0','--text':'#2c1810','--subtext':'#6a4a30','--accent':'#8b2020','--border':'#c0a878','--red':'#c82020' },
      };
      try {
        var entry = document.cookie.split('; ').find(function(r){ return r.startsWith('dm_prefs='); });
        var prefs = entry ? JSON.parse(decodeURIComponent(entry.substring(entry.indexOf('=') + 1))) : {};
        var vars = T[prefs.theme] || T.mocha;
        var root = document.documentElement;
        for (var k in vars) root.style.setProperty(k, vars[k]);
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <style>
    #panel-tracker {
      position: absolute;
      inset: 0;
      flex-direction: column;
      overflow: hidden;
      background: #1a1a1a;
      z-index: 1;
      display: none;
    }
    #panel-tracker:not([hidden]) {
      display: flex;
    }
    #tracker-subnav {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px 12px;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .tr-tab {
      background: none;
      border: 1px solid transparent;
      color: #888;
      font-family: inherit;
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: 0.03em;
    }
    .tr-tab:hover { color: #ccc; background: #1e1e1e; }
    .tr-tab.active { color: #f5f0e8; border-color: #444; background: #2a2a2a; }
    #tracker-saved {
      margin-left: auto;
      font-size: 11px;
      color: #558855;
      font-family: sans-serif;
    }
    #tracker-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 28px;
      color: #cdd6f4;
      font-family: 'Palatino Linotype', Palatino, serif;
    }
    .tr-section { max-width: 900px; }
    .tr-section h2 {
      font-size: 1.1em; font-weight: normal; color: #f5f0e8;
      border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 16px;
    }
    .tr-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
    .tr-table th {
      text-align: left; padding: 6px 10px; background: #222;
      color: #888; font-weight: normal; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .tr-table td { padding: 6px 10px; border-bottom: 1px solid #222; }
    .tr-table td input, .tr-table td select, .tr-table td textarea {
      background: transparent; border: none; color: #cdd6f4;
      font-family: inherit; font-size: 13px; width: 100%;
      outline: none; padding: 0;
    }
    .tr-table td input:focus, .tr-table td select:focus, .tr-table td textarea:focus {
      background: #222; border-radius: 2px; padding: 2px 4px;
    }
    .tr-table td select { cursor: pointer; }
    select option { background: #1a1a1a; }
    .tr-contract { margin-bottom: 24px; }
    .tr-contract-title {
      font-size: 1em; color: #f5f0e8; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid #2a2a2a;
      user-select: none;
    }
    .tr-contract-title .arrow { font-size: 10px; color: #666; transition: transform 0.15s; }
    .tr-contract-title.open .arrow { transform: rotate(90deg); }
    .tr-contract-body { padding: 12px 0 0 0; display: none; }
    .tr-contract-body.open { display: block; }
    .tr-checklist { list-style: none; padding: 0; margin: 0 0 12px 0; }
    .tr-checklist li {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 13px; cursor: pointer;
      color: #aaa;
    }
    .tr-checklist li.checked { color: #cdd6f4; text-decoration: none; }
    .tr-checklist li input[type=checkbox] { cursor: pointer; accent-color: #58180d; flex-shrink: 0; }
    .tr-notes {
      width: 100%; min-height: 60px; background: #161616;
      border: 1px solid #2a2a2a; border-radius: 3px;
      color: #cdd6f4; font-family: inherit; font-size: 13px;
      padding: 8px 10px; resize: vertical; margin-top: 8px;
      box-sizing: border-box;
    }
    .tr-notes:focus { outline: 1px solid #444; }
    .tr-add-btn {
      background: none; border: 1px dashed #444; color: #666;
      font-family: inherit; font-size: 12px; padding: 4px 12px;
      cursor: pointer; border-radius: 3px; margin-top: 8px;
    }
    .tr-add-btn:hover { border-color: #888; color: #aaa; }
    .tr-remove-btn {
      background: none; border: none; color: #555; cursor: pointer;
      font-size: 14px; padding: 0 4px; line-height: 1;
    }
    .tr-remove-btn:hover { color: #f38ba8; }
    .tr-gold-row { display: flex; gap: 24px; margin-bottom: 20px; align-items: center; font-size: 13px; }
    .tr-gold-row label { color: #888; }
    .tr-gold-row input {
      background: #161616; border: 1px solid #2a2a2a; border-radius: 3px;
      color: #cdd6f4; font-family: inherit; font-size: 13px;
      padding: 4px 8px; width: 120px;
    }
    .tr-session-list { list-style: none; padding: 0; margin: 0 0 16px 0; }
    .tr-session-item {
      padding: 10px 14px; border: 1px solid #2a2a2a; border-radius: 4px;
      margin-bottom: 8px; cursor: pointer; font-size: 13px;
    }
    .tr-session-item:hover { border-color: #444; background: #1e1e1e; }
    .tr-session-item .session-meta { color: #888; font-size: 11px; margin-bottom: 2px; }
    .tr-session-item .session-preview { color: #aaa; }
    .tr-session-form { border: 1px solid #333; border-radius: 4px; padding: 16px; margin-bottom: 16px; }
    .tr-session-form label { display: block; color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; margin-top: 12px; }
    .tr-session-form label:first-child { margin-top: 0; }
    .tr-session-form input, .tr-session-form textarea {
      width: 100%; background: #161616; border: 1px solid #2a2a2a;
      border-radius: 3px; color: #cdd6f4; font-family: inherit;
      font-size: 13px; padding: 6px 10px; box-sizing: border-box;
    }
    .tr-session-form textarea { min-height: 100px; resize: vertical; }
    .tr-session-save {
      background: #58180d; color: #f5f0e8; border: none;
      padding: 7px 18px; font-family: inherit; font-size: 13px;
      cursor: pointer; border-radius: 3px; margin-top: 12px;
    }
    .tr-session-save:hover { background: #7a2010; }

    /* ── Adventures Modal Dashboard ───────────────────────── */
    #panel-adventures { position: absolute; inset: 0; flex-direction: column; overflow: hidden; background: #1a1a1a; z-index: 1; display: none; }
    #panel-adventures:not([hidden]) { display: flex; }
    #adventures-content { flex: 1; overflow-y: auto; padding: 24px 28px; color: #cdd6f4; font-family: 'Palatino Linotype', Palatino, serif; }
    .adv-bar {
      display: flex; align-items: center; gap: 16px; padding: 0 0 12px;
      border-bottom: 1px solid #2a2a2a; margin-bottom: 14px; flex-shrink: 0;
      font-family: sans-serif; flex-wrap: wrap;
    }
    .adv-counts { display: flex; align-items: center; gap: 14px; }
    .adv-summary-stat { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #777; }
    .adv-summary-n { font-size: 20px; font-weight: bold; line-height: 1; font-family: monospace; }
    .adv-summary-n.current { color: #c9ad6a; }
    .adv-summary-n.completed { color: #7abf8a; }
    .adv-summary-n.upcoming { color: #666; }
    .adv-filters { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-left: auto; }
    .adv-filter-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: #555; padding: 0 2px; }
    .adv-filter-sep { width: 1px; height: 16px; background: #2a2a2a; margin: 0 4px; }
    .adv-filter-btn {
      font-size: 10px; padding: 2px 8px; border-radius: 3px; cursor: pointer;
      background: none; border: 1px solid #2a2a2a; color: #666; font-family: sans-serif;
      transition: all 0.1s;
    }
    .adv-filter-btn:hover { border-color: #555; color: #aaa; }
    .adv-filter-btn.active { border-color: #555; background: #252525; color: #ccc; }
    .adv-filter-btn.active[data-fst="current"]   { border-color: #c9ad6a; background: #2a2210; color: #c9ad6a; }
    .adv-filter-btn.active[data-fst="completed"] { border-color: #4a8a5a; background: #162018; color: #7abf8a; }
    .adv-filter-btn.active[data-fst="upcoming"]  { border-color: #666; background: #252525; color: #ccc; }
    .adv-header { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #555; margin-bottom: 8px; font-family: sans-serif; }
    .adv-season-badge { color: #777; }
    .adv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .adv-card {
      background: #1e1e1e; border: 1px solid #2a2a2a; border-left: 3px solid #333;
      border-radius: 5px; padding: 11px 13px; display: flex; flex-direction: column;
      gap: 7px; transition: background 0.12s;
    }
    .adv-card:hover { background: #222; }
    .adv-card--current   { border-left-color: #c9ad6a; background: #1c1b13; }
    .adv-card--current:hover { background: #21201a; }
    .adv-card--completed { border-left-color: #4a8a5a; background: #161e18; opacity: 0.85; }
    .adv-card--upcoming  { border-left-color: #333; }
    .adv-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .adv-title { font-size: 0.93em; color: #f0ebe0; line-height: 1.3; flex: 1; font-family: sans-serif; }
    .adv-open-btn {
      background: none; border: 1px solid #333; color: #555; border-radius: 3px;
      width: 22px; height: 22px; font-size: 12px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; transition: all 0.12s;
    }
    .adv-open-btn:hover { border-color: #89b4fa; color: #89b4fa; background: #1a2030; }
    .adv-meta2 { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888; font-family: sans-serif; flex-wrap: wrap; }
    .adv-meta2 b { color: #555; font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; }
    .adv-sep { color: #3a3a3a; }
    .adv-dots { display: flex; gap: 3px; align-items: center; margin-left: auto; }
    .adv-dot { width: 6px; height: 6px; border-radius: 50%; background: #2a2a2a; border: 1px solid #333; }
    .adv-dot.on { background: #c9ad6a; border-color: #c9ad6a; }
    .adv-arc { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; background: #1a281a; color: #7abf8a; border: 1px solid #2a4030; padding: 1px 5px; border-radius: 2px; }
    .adv-synopsis { font-size: 12px; color: #999; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .adv-status-row { display: flex; gap: 4px; padding-top: 6px; border-top: 1px solid #252525; }
    .adv-set-status {
      flex: 1; font-size: 10px; padding: 3px 0; border-radius: 3px; cursor: pointer;
      background: none; border: 1px solid #2a2a2a; color: #555; font-family: sans-serif;
      transition: all 0.1s; text-align: center;
    }
    .adv-set-status:hover { border-color: #555; color: #999; }
    .adv-set-status.active[data-status="upcoming"]  { border-color: #666; background: #252525; color: #bbb; }
    .adv-set-status.active[data-status="current"]   { border-color: #c9ad6a; background: #2a2210; color: #c9ad6a; }
    .adv-set-status.active[data-status="completed"] { border-color: #4a8a5a; background: #162018; color: #7abf8a; }

    /* ── NPC & Location Modals ───────────────────────────────── */
    .ref-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px; padding: 16px;
    }
    .ref-card {
      background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 5px;
      padding: 14px 16px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
      display: flex; flex-direction: column; gap: 8px;
    }
    .ref-card--npc { flex-direction: row; gap: 12px; padding: 10px 12px; align-items: flex-start; }
    .ref-card--npc .ref-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .ref-card-send {
      flex-shrink: 0; align-self: flex-start;
      background: none; border: 1px solid #333; border-radius: 4px;
      color: #666; font-size: 14px; padding: 3px 6px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .ref-card-send:hover { border-color: #c5a56a; color: #c5a56a; }
    .ref-thumb {
      width: 56px; height: 56px; border-radius: 4px; object-fit: cover; object-position: top;
      flex-shrink: 0; border: 1px solid #333; background: #111;
    }
    .ref-card-body { display: flex; flex-direction: column; gap: 8px; }
    .ref-card:hover { border-color: #444; background: #222; }
    .ref-title { font-size: 1em; color: #f5f0e8; line-height: 1.2; }
    .ref-meta {
      display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px;
      color: #888; font-family: sans-serif;
    }
    .ref-meta span { display: flex; align-items: center; gap: 3px; }
    .ref-tag {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
      background: #2a2a2a; color: #777; padding: 1px 6px; border-radius: 2px;
    }
    .ref-tag--ally { background: #1a2a1a; color: #7bc47b; }
    .ref-tag--hostile { background: #2a1a1a; color: #c47b7b; }
    .ref-tag--neutral { background: #252520; color: #b8a96a; }
    .ref-stat {
      font-size: 10px; font-family: monospace; color: #a0c4ff;
      background: #1a1f2a; border: 1px solid #2a3a4a; border-radius: 2px;
      padding: 0 5px;
    }
    .ref-synopsis {
      font-size: 12px; color: #aaa; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-top: 2px;
    }
    .ref-search {
      padding: 12px 16px; background: #111; border-bottom: 1px solid #2a2a2a;
      display: flex; gap: 8px; flex-shrink: 0;
    }
    .ref-search input {
      flex: 1; background: #1a1a1a; border: 1px solid #333; color: #cdd6f4;
      border-radius: 3px; padding: 6px 10px; font-size: 13px; font-family: sans-serif;
    }
    .ref-search input:focus { outline: 1px solid #cba6f7; border-color: #444; }
    .ref-filter {
      font-size: 11px; color: #888; font-family: sans-serif;
      padding: 0 16px 8px; background: #111; border-bottom: 1px solid #2a2a2a;
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    }
    .ref-filter button {
      background: #1a1a1a; border: 1px solid #333; color: #888;
      border-radius: 3px; padding: 2px 8px; font-size: 11px; cursor: pointer;
    }
    .ref-filter button.active { background: #2a2a2a; color: #ccc; border-color: #555; }
    .ref-filter button:hover { border-color: #555; }
    .ref-scroll { flex: 1; overflow-y: auto; }
    .ref-empty { padding: 40px; text-align: center; color: #666; font-family: sans-serif; font-size: 13px; }

    /* ── NPC Detail View ─────────────────────────────────────── */
    .npc-detail { display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
    .npc-back-btn {
      align-self: flex-start; margin: 12px 16px 0; background: none; border: 1px solid #333;
      color: #888; border-radius: 3px; padding: 4px 10px; font-size: 12px;
      cursor: pointer; font-family: sans-serif;
    }
    .npc-back-btn:hover { border-color: #555; color: #ccc; }
    .npc-detail-hero {
      display: flex; gap: 20px; padding: 16px 20px; align-items: flex-start;
    }
    .npc-detail-portrait {
      width: 120px; height: 150px; border-radius: 6px; object-fit: cover; object-position: top;
      border: 1px solid #333; background: #111; flex-shrink: 0;
    }
    .npc-detail-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .npc-detail-name { font-size: 1.3em; color: #f5f0e8; font-family: sans-serif; line-height: 1.2; }
    .npc-detail-stats {
      display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px;
      color: #aaa; font-family: sans-serif;
    }
    .npc-detail-synopsis { font-size: 13px; color: #aaa; line-height: 1.5; font-family: sans-serif; }
    .npc-detail-open {
      align-self: flex-start; background: #2a2a2a; border: 1px solid #444; color: #ccc;
      border-radius: 4px; padding: 6px 14px; font-size: 12px; cursor: pointer;
      font-family: sans-serif; margin-top: 4px;
    }
    .npc-detail-open:hover { background: #333; border-color: #666; }
    .npc-hero-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .npc-stat-frame {
      display: flex; flex-direction: column; align-items: center;
      background: #1a1f2a; border: 1px solid #2a3a50; border-radius: 5px;
      padding: 4px 10px; min-width: 48px;
    }
    .nsf-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: #6a8ab8; font-family: sans-serif; }
    .nsf-val { font-size: 16px; font-weight: bold; color: #a8c8f0; font-family: monospace; line-height: 1.2; }
    .npc-no-portrait {
      background: #111; border: 1px solid #2a2a2a; display: flex; align-items: center;
      justify-content: center;
    }
    /* Location detail hero (no portrait — use type icon) */
    .loc-detail-hero { display: flex; gap: 20px; padding: 16px 20px; align-items: flex-start; }
    .loc-detail-icon {
      width: 72px; height: 72px; border-radius: 8px; background: #1a2030; border: 1px solid #2a3a50;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: #6a8ab8; font-family: serif; flex-shrink: 0;
      text-transform: uppercase;
    }
    /* Location content: h4 headings styled differently */
    .loc-content-html h4 { color: #c8d8f0; border-bottom-color: #2a3a50; }
    .loc-content-html .sb-row span:first-child { color: #c8d8f0; background: #1a2030; }
    .loc-content-html ul { color: #ccc; }
    .loc-content-html strong { color: #c8d8f0; }
    /* Stat block HTML rendered inside dark modal */
    .npc-stat-section-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #888;
      font-family: sans-serif; border-bottom: 1px solid #2a2a2a; padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .npc-stat-html { font-family: sans-serif; font-size: 13px; color: #d8d8d8; line-height: 1.5; }
    .npc-stat-html h4 { color: #f0e8d0; font-size: 13px; margin: 12px 0 4px; border-bottom: 1px solid #333; padding-bottom: 3px; }
    .npc-stat-html .sb-row { display: flex; gap: 0; margin: 1px 0; }
    .npc-stat-html .sb-row span { flex: 1; padding: 4px 10px; font-size: 12px; color: #ccc; min-width: 0; text-align: center; border: 1px solid #222; }
    /* Two-column stat rows: bold label left, value right */
    .npc-stat-html .sb-row:has(> span:nth-child(2):last-child) span:first-child {
      color: #f0e8d0; font-weight: bold; flex: 0 0 170px; text-align: left; background: #1e1e1e;
    }
    .npc-stat-html .sb-row:has(> span:nth-child(2):last-child) span:last-child {
      text-align: left;
    }
    .npc-stat-html hr { border: none; border-top: 1px solid #333; margin: 6px 0; }
    .npc-stat-html .sb-row--ab-header { background: #3a1010; }
    .npc-stat-html .sb-row--ab-header span { color: #e8c0a0; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; border-color: #4a2020; }
    .npc-stat-html b, .npc-stat-html strong { color: #f0e8d0; }
    .npc-stat-html em { color: #b8c8e8; font-style: italic; }

    /* ── Homebrew Modal ──────────────────────────────────────── */
    .hb-card { border-left: 3px solid #2a2a2a; }
    .hb-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .hb-rarity {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 1px 6px; border-radius: 2px; white-space: nowrap; flex-shrink: 0;
    }
    .hb-r-common     { background: #222; color: #888; border: 1px solid #333; }
    .hb-r-uncommon   { background: #1a2a1a; color: #7abf8a; border: 1px solid #2a5030; }
    .hb-r-rare       { background: #1a1e2e; color: #7eb8e8; border: 1px solid #2a3a5a; }
    .hb-r-very-rare  { background: #21182e; color: #b07ae8; border: 1px solid #4a2a6a; }
    .hb-r-legendary  { background: #2e2010; color: #e8a03a; border: 1px solid #6a4510; }
    .hb-r-artifact   { background: #2e1010; color: #e87a6a; border: 1px solid #6a2a1a; }
    .hb-type-tag { background: #1a1e30; color: #8aa8d8; border: 1px solid #2a3060 !important; }
    /* Apply left-border color to card by rarity */
    .hb-card:has(.hb-r-uncommon)  { border-left-color: #4a8a5a; }
    .hb-card:has(.hb-r-rare)      { border-left-color: #3a5a8a; }
    .hb-card:has(.hb-r-very-rare) { border-left-color: #6a3a9a; }
    .hb-card:has(.hb-r-legendary) { border-left-color: #9a6a1a; }
    .hb-card:has(.hb-r-artifact)  { border-left-color: #9a3a2a; }
    /* Detail hero */
    .hb-detail-hero { display: flex; gap: 20px; padding: 16px 20px; align-items: flex-start; }
    .hb-detail-type-icon {
      width: 64px; height: 64px; border-radius: 8px; background: #1a1e30; border: 1px solid #2a3060;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #8aa8d8; font-family: monospace; font-weight: bold; flex-shrink: 0;
      letter-spacing: -1px;
    }
    /* Homebrew content: slightly different from location (purple-blue accent) */
    .hb-content-html h4 { color: #b0c0e8; border-bottom-color: #2a3060; }
    .hb-content-html strong { color: #c0d0f0; }
    .hb-content-html .sb-row span:first-child { color: #b0c0e8; background: #1a1e30; }
    .hb-content-html hr { border-top-color: #2a2a3a; }
    .hb-content-html ul { color: #ccc; }
    .hb-content-html blockquote {
      border-left: 3px solid #4a4a6a; padding: 8px 12px; margin: 8px 0;
      background: #1a1a2a; border-radius: 3px; color: #aaa; font-style: italic;
    }

    /* ── Maps tab ─────────────────────────────────────────────────────── */
    .maps-form { padding: 16px 20px; border-bottom: 1px solid #2a2a2a; }
    .maps-style-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
    .maps-style-btn { padding: 6px 16px; border: 1px solid #444; background: #1a1a1a; color: #aaa; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .maps-style-btn.active { background: #1e3a5a; border-color: #3a7abf; color: #c8d8e8; }
    .maps-prompt-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .maps-prompt { width: 100%; box-sizing: border-box; background: #111; border: 1px solid #333; color: #e8e0d0; border-radius: 4px; padding: 8px; resize: vertical; min-height: 60px; font-family: inherit; font-size: 13px; margin-bottom: 8px; }
    .maps-prompt:focus { outline: none; border-color: #3a7abf; }
    .maps-generate-btn { padding: 8px 24px; background: #1e3a1e; border: 1px solid #3a7a3a; color: #7ada7a; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .maps-generate-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .maps-spinner { text-align: center; padding: 12px; color: #666; font-size: 13px; }
    .maps-gen-error { color: #e05050; font-size: 13px; padding: 8px 0; }
    .maps-gallery { padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .maps-gallery-empty { padding: 32px; text-align: center; color: #555; font-size: 13px; }
    .maps-thumb { border-radius: 4px; overflow: hidden; cursor: pointer; border: 1px solid #2a2a2a; transition: border-color .15s; }
    .maps-thumb:hover { border-color: #3a7abf; }
    .maps-thumb img { width: 100%; display: block; }
    .maps-thumb-name { font-size: 11px; color: #666; padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #111; }
    .maps-lightbox { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .maps-lightbox img { max-width: 100%; max-height: 70vh; border-radius: 4px; }
    .maps-lightbox-name { margin-top: 8px; font-size: 12px; color: #666; }

    /* ── Party Modal ──────────────────────────────────────────── */
    .pc-tabs { display:flex; gap:4px; padding:12px 16px 0; border-bottom:1px solid #c9ad6a; background:#f4e8c1; flex-shrink:0; overflow-x:auto; scrollbar-width:none; }
    .pc-tabs::-webkit-scrollbar { display:none; }
    .pc-tab { background:none; border:none; border-bottom:3px solid transparent; color:#7a6050; font-family:'Palatino Linotype',Palatino,serif; font-size:13px; padding:6px 14px 8px; cursor:pointer; transition:color 0.15s; flex-shrink:0; white-space:nowrap; }
    .pc-tab:hover { color:#3b0d0d; }
    .pc-tab.active { color:#3b0d0d; border-bottom-color:#58180d; font-weight:bold; }
    .pc-scroll { flex:1; overflow-y:auto; background:#f4e8c1; }
    .pc-sheet { padding:20px 24px; max-width:900px; color:#2c1810; font-family:'Palatino Linotype',Palatino,serif; }
    .pc-header { margin-bottom:16px; border-bottom:3px solid #c9ad6a; padding-bottom:12px; }
    .pc-name { font-size:1.5em; color:#58180d; text-transform:uppercase; letter-spacing:1px; font-weight:bold; display:flex; align-items:center; gap:10px; }
    .pc-companion-badge { font-size:0.5em; background:#58180d; color:#f5f0e8; padding:2px 8px; border-radius:3px; letter-spacing:0.05em; vertical-align:middle; }
    .pc-meta { font-size:0.9em; color:#7a6050; margin-top:4px; }
    .pc-body { display:grid; grid-template-columns:160px 1fr 160px; gap:20px; }
    .pc-abilities { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:16px; }
    .pc-ability { border:2px solid #c9ad6a; border-radius:6px; text-align:center; padding:6px 4px; background:#ede8da; }
    .pc-ability-name { font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:#7a6050; }
    .pc-ability-mod { font-size:1.3em; font-weight:bold; color:#3b0d0d; line-height:1.1; }
    .pc-ability-score { font-size:10px; color:#7a6050; }
    .pc-section { margin-bottom:14px; }
    .pc-section-title { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:#7a6050; border-bottom:1px solid #c9ad6a; padding-bottom:2px; margin-bottom:6px; }
    .pc-combat { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:16px; }
    .pc-combat-stat { border:2px solid #c9ad6a; border-radius:4px; text-align:center; padding:6px 4px; background:#ede8da; }
    .pc-cs-label { font-size:9px; text-transform:uppercase; letter-spacing:0.06em; color:#7a6050; }
    .pc-cs-value { font-size:1.2em; font-weight:bold; color:#3b0d0d; }
    .pc-saves { display:flex; flex-wrap:wrap; gap:6px; }
    .pc-save { background:#ede8da; border:1px solid #c9ad6a; border-radius:3px; padding:2px 8px; font-size:12px; color:#3b0d0d; }
    .pc-def-row, .pc-prof-row, .pc-passive-row { font-size:12px; margin-bottom:3px; color:#2c1810; }
    .pc-def-label { font-weight:bold; color:#58180d; font-size:10px; text-transform:uppercase; }
    .pc-lang { font-size:12px; color:#2c1810; }
    .pc-skills-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; }
    .pc-skill { font-size:11px; display:flex; align-items:center; gap:5px; padding:2px 0; color:#2c1810; }
    .pc-skill-mod { font-weight:bold; color:#3b0d0d; min-width:26px; text-align:right; font-size:12px; }
    .pc-attacks { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:4px; }
    .pc-attacks th { background:#58180d; color:#f5f0e8; padding:5px 8px; text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; }
    .pc-attacks td { padding:5px 8px; border-bottom:1px solid #ddd; }
    .pc-attacks tr:nth-child(even) td { background:#ede8da; }
    .pc-spell-stats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
    .pc-spell-stat { font-size:12px; color:#2c1810; }
    .pc-spell-grid { display:flex; flex-wrap:wrap; gap:10px; }
    .pc-spell-table { border-collapse:collapse; font-size:12px; flex-shrink:0; }
    .pc-spell-table--wide { flex:1; min-width:180px; }
    .pc-spell-table th { background:#58180d; color:#f5f0e8; padding:4px 8px; text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; }
    .pc-spell-table td { padding:4px 8px; border-bottom:1px solid #ddd; vertical-align:top; }
    .pc-spell-table tr:nth-child(even) td { background:#ede8da; }
    .pc-spell-extra { margin-top:10px; }
    .pc-spell-extra-title { font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:#7a6050; margin-bottom:4px; font-style:italic; }
    .pc-feature { margin-bottom:10px; }
    .pc-feature-name { font-weight:bold; color:#3b0d0d; font-size:13px; }
    .pc-feature-sub { font-weight:normal; font-size:11px; color:#7a6050; }
    .pc-feature-desc { font-size:12px; color:#2c1810; margin-top:3px; line-height:1.5; }
    .link-5e-inline { color:#58180d !important; text-decoration:underline; cursor:pointer; }
    .link-homebrew-gen { color:#7a5020 !important; text-decoration:underline dotted; }
    .link-homebrew-gen::after { content:'✦'; font-size:8px; vertical-align:super; margin-left:1px; opacity:0.6; }
    @media (max-width:700px) {
      .pc-body { grid-template-columns:1fr; }
      .pc-col-right { order:-1; }
    }

    /* ── Combat Tracker Modal ────────────────────────────────── */
    .ct-wrap { display:flex; flex-direction:column; height:100%; font-family:'Segoe UI',sans-serif; background:#111; color:#cdd6f4; }
    .ct-header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#0d0d0d; border-bottom:1px solid #2a2a2a; flex-shrink:0; }
    .ct-round { font-size:13px; color:#888; }
    .ct-round strong { color:#cdd6f4; font-size:16px; }
    .ct-next-btn { background:#58180d; color:#f5f0e8; border:none; padding:5px 14px; border-radius:3px; cursor:pointer; font-size:12px; font-weight:600; }
    .ct-next-btn:hover { background:#7a2010; }
    .ct-reset-btn { margin-left:auto; background:none; border:1px solid #333; color:#666; padding:4px 10px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-reset-btn:hover { border-color:#f38ba8; color:#f38ba8; }
    .ct-list { flex:1; overflow-y:auto; padding:8px 0; }
    .ct-row {
      display:grid; grid-template-columns:40px 1fr 52px 120px auto;
      align-items:center; gap:0; padding:6px 16px;
      border-left:3px solid transparent; transition:background 0.1s;
    }
    .ct-row:hover { background:#1a1a1a; }
    .ct-row.ct-active { border-left-color:#cba6f7; background:#1a1a2a; }
    .ct-row.ct-dead { opacity:0.4; }
    .ct-init { font-size:18px; font-weight:700; color:#cba6f7; text-align:center; cursor:pointer; border:none; background:none; width:36px; padding:0; font-family:'Segoe UI',sans-serif; }
    .ct-init:focus { outline:1px solid #444; border-radius:2px; }
    .ct-name { font-size:13px; color:#f5f0e8; cursor:pointer; padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ct-name:focus { outline:1px solid #444; border-radius:2px; background:#222; padding:0 4px; }
    .ct-ac { font-size:12px; color:#888; text-align:center; cursor:pointer; border:none; background:none; width:44px; font-family:'Segoe UI',sans-serif; }
    .ct-ac:focus { outline:1px solid #444; border-radius:2px; background:#222; }
    .ct-hp-ctrl { display:flex; align-items:center; gap:4px; }
    .ct-hp-btn { background:#1e1e2e; border:1px solid #333; color:#cdd6f4; width:22px; height:22px; border-radius:3px; cursor:pointer; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ct-hp-btn:hover { background:#2a2a3a; }
    .ct-hp-cur { width:36px; text-align:center; background:none; border:none; color:#a6e3a1; font-size:14px; font-weight:700; font-family:'Segoe UI',sans-serif; cursor:pointer; }
    .ct-hp-cur:focus { outline:1px solid #444; border-radius:2px; background:#222; }
    .ct-hp-sep { color:#444; font-size:11px; }
    .ct-hp-max { width:32px; text-align:center; background:none; border:none; color:#888; font-size:12px; font-family:'Segoe UI',sans-serif; cursor:pointer; }
    .ct-hp-max:focus { outline:1px solid #444; border-radius:2px; background:#222; }
    .ct-hp-cur[data-low="true"] { color:#f38ba8; }
    .ct-actions { display:flex; align-items:center; gap:6px; padding-left:8px; }
    .ct-cond-wrap { display:flex; flex-wrap:wrap; gap:3px; padding:2px 16px 4px 58px; }
    .ct-cond { font-size:10px; background:#2a1a1a; border:1px solid #58180d; color:#f38ba8; border-radius:2px; padding:1px 6px; cursor:pointer; }
    .ct-cond:hover { background:#3a1a1a; }
    .ct-cond-btn { background:none; border:1px dashed #333; color:#555; font-size:10px; border-radius:2px; padding:1px 6px; cursor:pointer; }
    .ct-cond-btn:hover { border-color:#666; color:#888; }
    .ct-remove-btn { background:none; border:none; color:#444; cursor:pointer; font-size:16px; line-height:1; padding:0 2px; }
    .ct-remove-btn:hover { color:#f38ba8; }
    .ct-add-form { display:flex; align-items:center; gap:6px; padding:10px 16px; background:#0d0d0d; border-top:1px solid #2a2a2a; flex-shrink:0; flex-wrap:wrap; }
    .ct-add-form input { background:#1a1a1a; border:1px solid #333; color:#cdd6f4; border-radius:3px; padding:5px 8px; font-size:12px; font-family:'Segoe UI',sans-serif; }
    .ct-add-form input:focus { outline:1px solid #cba6f7; }
    .ct-add-form input[name=name] { flex:1; min-width:100px; }
    .ct-add-form input[name=init] { width:48px; }
    .ct-add-form input[name=ac]   { width:44px; }
    .ct-add-form input[name=hp]   { width:52px; }
    .ct-add-form label { font-size:10px; color:#666; text-transform:uppercase; letter-spacing:0.05em; }
    .ct-type-sel { background:#1a1a1a; border:1px solid #333; color:#cdd6f4; border-radius:3px; padding:5px 6px; font-size:12px; cursor:pointer; }
    .ct-add-submit { background:#313244; border:none; color:#cdd6f4; padding:5px 14px; border-radius:3px; cursor:pointer; font-size:12px; }
    .ct-add-submit:hover { background:#45475a; }
    .ct-empty { padding:40px; text-align:center; color:#555; font-size:13px; }
    .ct-save-btn { background:#1e3a1e; color:#a6e3a1; border:1px solid #2a4a2a; padding:4px 11px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-save-btn:hover { background:#2a4a2a; }
    .ct-load-btn { background:#1a1a2e; color:#cba6f7; border:1px solid #2a2a4a; padding:4px 11px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-load-btn:hover { background:#2a2a4a; }
    .ct-save-bar { display:flex; align-items:center; gap:6px; padding:8px 16px; background:#0a0a0a; border-top:1px solid #2a2a2a; flex-shrink:0; }
    .ct-save-bar input { flex:1; background:#1a1a1a; border:1px solid #333; color:#cdd6f4; border-radius:3px; padding:5px 10px; font-size:12px; font-family:'Segoe UI',sans-serif; }
    .ct-save-bar input:focus { outline:1px solid #a6e3a1; }
    .ct-save-confirm { background:#1e3a1e; color:#a6e3a1; border:1px solid #2a4a2a; padding:5px 12px; border-radius:3px; cursor:pointer; font-size:12px; }
    .ct-save-confirm:hover { background:#2a4a2a; }
    .ct-save-cancel { background:none; border:none; color:#555; cursor:pointer; font-size:16px; padding:0 4px; }
    .ct-save-cancel:hover { color:#f38ba8; }
    .ct-saved-msg { font-size:11px; color:#a6e3a1; margin-left:4px; }
    .ct-enc-list { list-style:none; padding:0; margin:0; }
    .ct-enc-item { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid #1a1a1a; }
    .ct-enc-item:hover { background:#1a1a1a; }
    .ct-enc-name { flex:1; font-size:13px; color:#cdd6f4; }
    .ct-enc-date { font-size:11px; color:#555; }
    .ct-enc-load { background:#1a1a2e; color:#cba6f7; border:1px solid #2a2a4a; padding:4px 10px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-enc-load:hover { background:#2a2a4a; }
    .ct-enc-del { background:none; border:none; color:#444; cursor:pointer; font-size:15px; padding:0 2px; }
    .ct-enc-del:hover { color:#f38ba8; }
    .ct-import-panel { background:#0d0d0d; border-top:1px solid #2a2a2a; flex-shrink:0; max-height:240px; overflow-y:auto; }
    .ct-import-hdr { display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid #1a1a1a; position:sticky; top:0; background:#0d0d0d; z-index:1; }
    .ct-import-hdr span { font-size:11px; color:#666; text-transform:uppercase; letter-spacing:0.05em; flex:1; }
    .ct-import-add-all { background:#313244; border:none; color:#cdd6f4; padding:4px 10px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-import-add-all:hover { background:#45475a; }
    .ct-import-row { display:flex; align-items:center; gap:8px; padding:6px 16px; border-bottom:1px solid #1a1a1a; }
    .ct-import-row:hover { background:#111; }
    .ct-import-name { flex:1; font-size:12px; color:#cdd6f4; }
    .ct-import-stats { font-size:11px; color:#666; white-space:nowrap; }
    .ct-import-count { width:36px; background:#1a1a1a; border:1px solid #333; color:#cdd6f4; border-radius:3px; padding:2px 4px; font-size:12px; text-align:center; }
    .ct-import-btn { background:#1a1a2e; color:#cba6f7; border:1px solid #2a2a4a; padding:3px 9px; border-radius:3px; cursor:pointer; font-size:11px; white-space:nowrap; }
    .ct-import-btn:hover { background:#2a2a4a; }
    .ct-from-adv-btn { background:#1a1a2e; color:#cba6f7; border:1px solid #2a2a4a; padding:5px 11px; border-radius:3px; cursor:pointer; font-size:11px; }
    .ct-from-adv-btn:hover { background:#2a2a4a; }
    .ct-from-adv-btn[hidden] { display:none; }
    .ct-cond-picker { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px 6px 58px; background:#161616; border-top:1px solid #1e1e1e; }
    .ct-cond-opt { font-size:10px; background:none; border:1px solid #333; color:#666; border-radius:2px; padding:2px 7px; cursor:pointer; }
    .ct-cond-opt:hover { border-color:#888; color:#aaa; }
    .ct-cond-opt.selected { background:#2a1a1a; border-color:#58180d; color:#f38ba8; }

    /* ── Player Screen strip ── */
    #player-strip {
      grid-area: ps;
      display: flex; align-items: center; gap: 8px;
      padding: 4px 12px; background: #0a0a0a; border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0; font-size: 12px; font-family: sans-serif; min-height: 28px;
    }
    #ps-icon { font-size: 13px; flex-shrink: 0; }
    #ps-status-text { color: #666; flex-shrink: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
    .ps-action {
      padding: 2px 8px; background: #181818; border: 1px solid #2a2a2a;
      border-radius: 3px; color: #aaa; cursor: pointer; font-size: 11px;
      font-family: sans-serif; white-space: nowrap; flex-shrink: 0;
    }
    .ps-action:hover { background: #222; border-color: #444; color: #ccc; }
    .ps-action--muted { color: #555; }
    .ps-action--open  { color: #c5a56a; border-color: #4a3820; }
    .ps-action--open:hover { background: #2a1e08; }
    #ps-clear { color: #666; }
    #ps-clear:hover { color: #f38ba8; border-color: #f38ba8; }
    #ps-msg-wrap, #ps-idle-wrap { display: flex; align-items: center; gap: 4px; }
    #ps-msg-input, #ps-idle-input {
      background: #181818; border: 1px solid #2a2a2a; color: #ccc;
      border-radius: 3px; padding: 2px 8px; font-size: 11px;
      font-family: sans-serif; width: 200px;
    }
    #ps-msg-input:focus, #ps-idle-input:focus { outline: 1px solid #c5a56a; border-color: #4a3820; }
    .ps-right { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  </style>
</head>
<body>

  <header id="tabbar">
    <!-- Mobile-only drawer toggles — grouped at start so they're always visible without scrolling -->
    <button class="mob-btn" id="mob-files" aria-label="Toggle file browser">☰</button>
    <button class="mob-btn" id="mob-term" aria-label="Toggle terminal">⌨</button>

    <nav class="tab-group">
      <button class="tab" data-path="gm-lore/welcome.md">Home</button>
      <button class="tab" id="tab-tracker" data-tab="tracker">Tracker</button>
      <button class="tab" id="tab-party" data-tab="party">Party</button>
      <button class="tab" id="tab-adventures" data-tab="adventures">Adventures</button>
      <button class="tab" id="tab-npcs" data-tab="npcs">NPCs</button>
      <button class="tab" id="tab-locations" data-tab="locations">Locations</button>
      <button class="tab" id="tab-combat-tracker" data-tab="combat-tracker">Combat Tracker</button>
      <button class="tab" id="tab-homebrew" data-tab="homebrew">Homebrew</button>
      <button class="tab" id="tab-shops" data-tab="shops">Shops</button>
      <div id="tools-wrap">
        <button id="btn-tools">Tools ▾</button>
      </div>
      <button id="btn-rulebooks" class="tab" title="Open PDF rulebook viewer">📖 Rulebooks</button>
    </nav>

    <div id="search-wrap">
      <input id="search-input" type="search" placeholder="Search files…" autocomplete="off" spellcheck="false">
    </div>

    <div id="season-wrap">
      <label for="season-sel">Season</label>
      <select id="season-sel">
        <option value="">All</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      <button id="btn-novels" class="tab" title="Open novel reader">📖 Novels</button>
      <button id="btn-lore" class="tab" title="Semantic lore search (RAG)">🔮 Lore</button>
        <option value="6">6</option>
      </select>
    </div>

    <div id="season-tracker" title="Current campaign season — click to change">
      <span id="season-tracker-icon"></span>
      <span id="season-tracker-name"></span>
    </div>

    <div id="breadcrumb" title="Current path"></div>
    <button id="btn-ctx" title="Send file path to terminal" hidden>⌨ Path</button>
    <button id="btn-manifest" title="Edit MANIFEST.md for current directory" hidden>✎ Manifest</button>
    <button id="btn-print" title="Print this handout" hidden>🖨 Print</button>
    <button id="btn-send-player" title="Send handout to player screen" hidden>📺 Send</button>

    <div id="toast" aria-live="polite"></div>
  </header>

  <!-- Player screen Now Showing strip -->
  <div id="player-strip">
    <span id="ps-icon">📺</span>
    <span id="ps-status-text">Idle</span>
    <button id="ps-clear" class="ps-action" hidden>✕ Clear</button>
    <div id="ps-msg-wrap" hidden>
      <input id="ps-msg-input" type="text" placeholder="Message to players…" maxlength="500">
      <button id="ps-msg-send" class="ps-action">Send</button>
      <button id="ps-msg-cancel" class="ps-action ps-action--muted">✕</button>
    </div>
    <div id="ps-idle-wrap" hidden>
      <input id="ps-idle-input" type="text" placeholder="Idle screen message…" maxlength="200">
      <button id="ps-idle-save" class="ps-action">Save</button>
      <button id="ps-idle-cancel" class="ps-action ps-action--muted">✕</button>
    </div>
    <div class="ps-right">
      <button id="ps-msg-btn"  class="ps-action" title="Send a message to players">✉</button>
      <button id="ps-idle-btn" class="ps-action" title="Edit idle screen message">✏ Idle</button>
      <button id="ps-open"     class="ps-action ps-action--open" title="Open player screen in new tab">Open ↗</button>
    </div>
  </div>

  <!-- Season picker (body-level so it escapes tabbar overflow clipping) -->
  <div id="season-picker" hidden></div>

  <!-- Tools dropdown (body-level so it escapes tabbar overflow clipping) -->
  <div id="tools-dropdown" hidden>
    <div class="tools-section">
      <div class="tools-section-label">World Tables</div>
      <div id="tools-world-tables">
        <div class="tool-item" style="color:var(--subtext);cursor:default;font-style:italic">Loading…</div>
      </div>
    </div>
    <div class="tools-section">
      <div class="tools-section-label">SRD Tools</div>
      <button id="tool-random-encounter" class="tool-item">⚔ Random Encounter</button>
      <button id="tool-treasure-hoard" class="tool-item">💰 Treasure Hoard</button>
    </div>
    <div class="tools-section">
      <div class="tools-section-label">🗺️ VTT Screen</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px 6px">
        <button class="vtt-fx-btn" data-fx="rain">🌧 Rain</button>
        <button class="vtt-fx-btn" data-fx="fog">🌫 Fog</button>
        <button class="vtt-fx-btn" data-fx="snow">❄️ Snow</button>
        <button class="vtt-fx-btn" data-fx="fire">🔥 Fire</button>
      </div>
      <div class="vtt-dark-row">
        <span>🌑</span>
        <input type="range" id="vtt-dark-slider" min="0" max="100" value="0">
        <span id="vtt-dark-val">0%</span>
      </div>
      <div style="display:flex;gap:4px;padding:4px 12px 8px">
        <button id="vtt-clear-fx" class="tool-item" style="flex:1;padding:5px 8px;font-size:11px">✕ Clear</button>
        <button id="vtt-open" class="tool-item" style="flex:1;padding:5px 8px;font-size:11px;color:var(--accent)">↗ Open VTT</button>
      </div>
    </div>
    <div class="tools-section">
      <div class="tools-section-label">5etools</div>
      <button class="tool-item tool-5e" data-5e-path="">🎲 5etools</button>
      <button class="tool-item tool-5e" data-5e-path="bestiary.html">🐉 Bestiary</button>
      <button class="tool-item tool-5e" data-5e-path="spells.html">✨ Spells</button>
    </div>
    <div class="tools-section">
      <div class="tools-section-label">Theme</div>
      <button class="tool-item theme-item" data-theme="mocha">
        <span class="theme-swatch" style="background:#cba6f7"></span> Mocha
      </button>
      <button class="tool-item theme-item" data-theme="tavern">
        <span class="theme-swatch" style="background:#d4a849"></span> Tavern
      </button>
      <button class="tool-item theme-item" data-theme="midnight">
        <span class="theme-swatch" style="background:#5b8fff"></span> Midnight
      </button>
      <button class="tool-item theme-item" data-theme="forest">
        <span class="theme-swatch" style="background:#5cba6c"></span> Forest
      </button>
      <button class="tool-item theme-item" data-theme="arcane">
        <span class="theme-swatch" style="background:#48d0c8"></span> Arcane
      </button>
      <button class="tool-item theme-item" data-theme="parchment">
        <span class="theme-swatch" style="background:#8b2020"></span> Parchment
      </button>
    </div>
  </div>

  <!-- Backdrop for mobile drawers -->
  <div id="drawer-backdrop"></div>

  <div id="workspace">

    <aside id="panel-left">
      <div class="panel-hdr">Files</div>
      <div id="file-tree"></div>
      <div class="panel-hdr panel-hdr-maps">Maps</div>
      <div id="left-maps-panel">
        <input id="left-maps-filter" class="left-maps-filter" type="search" placeholder="Filter maps…" autocomplete="off">
        <div id="left-maps-gallery"></div>
        <button id="left-maps-gen-btn" class="left-maps-generate-btn">+ Generate Map</button>
        <div id="left-maps-gen-form" hidden>
          <div class="left-maps-style-row">
            <button class="left-maps-style-btn active" data-style="topdown">Top-down</button>
            <button class="left-maps-style-btn" data-style="scene">Scene</button>
          </div>
          <textarea id="left-maps-prompt" class="left-maps-prompt" placeholder="dungeon room, stone floor, torches…" rows="3"></textarea>
          <button id="left-maps-submit" class="left-maps-submit-btn">Generate</button>
          <div id="left-maps-status"></div>
        </div>
      </div>
    </aside>

    <div class="rh" id="rh-l" title="Drag to resize · click ‹ to collapse">
      <button class="cbt" id="cbt-l" aria-label="Toggle file browser">‹</button>
    </div>

    <main id="panel-center">
      <iframe id="viewer" src="about:blank" title="Content viewer"></iframe>
      <div id="panel-tracker" hidden>
        <nav id="tracker-subnav">
          <button class="tr-tab active" data-section="contracts">Contracts</button>
          <button class="tr-tab" data-section="party">Party</button>
          <button class="tr-tab" data-section="npcs">NPCs</button>
          <button class="tr-tab" data-section="clues">Echo</button>
          <button class="tr-tab" data-section="promises">Promises</button>
          <button class="tr-tab" data-section="treasure">Treasure</button>
          <button class="tr-tab" data-section="sessions">Sessions</button>
          <span id="tracker-saved"></span>
        </nav>
        <div id="tracker-content"></div>
      </div>
      <div id="panel-adventures" hidden>
        <div id="adventures-content"></div>
      </div>
    </main>

    <div class="rh" id="rh-r" title="Drag to resize · click › to collapse">
      <button class="cbt" id="cbt-r" aria-label="Toggle terminal">›</button>
    </div>

    <aside id="panel-right">
      <div class="panel-hdr">Terminal</div>
      <div id="term-wrap"></div>
    </aside>

  </div>

  <!-- Modal overlay (primary) -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title"></span>
        <button class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- Modal overlay (nested, max 2 deep) -->
  <div id="modal2" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title"></span>
        <button class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="app.js"></script>
  <script src="sounds.js"></script>

  <!-- Hidden audio elements for crossfade -->
  <audio id="snd-a"></audio>
  <audio id="snd-b"></audio>

  <div id="snd-fx-panel" hidden>
    <div id="snd-fx-header">
      <span>Spell Effects</span>
      <button id="snd-fx-close">✕</button>
    </div>
    <div id="snd-fx-grid"></div>
  </div>

  <!-- Ambient sound bar -->
  <div id="sound-bar">
    <span id="snd-icon">♪</span>
    <span id="snd-name">— stopped —</span>
    <button id="snd-play">▶ Play</button>
    <button id="snd-loop" title="Loop">⟳</button>
    <div id="snd-quick"></div>
    <span id="snd-suggest-label" hidden>suggested for this file</span>
    <div id="snd-vol-wrap">
      <span>🔊</span>
      <input id="snd-vol" type="range" min="0" max="100" value="70">
    </div>
    <span class="snd-divider">│</span>
    <button id="snd-fx-btn" title="Spell Effects">⚡ FX</button>
  </div>
</body>
</html>

  <!-- Lore RAG semantic-search modal (self-contained) -->
  <style>
    #lore-modal{position:fixed;inset:0;z-index:9000;display:none;background:rgba(0,0,0,.55);}
    #lore-modal.open{display:flex;align-items:flex-start;justify-content:center;}
    #lore-box{margin-top:6vh;width:min(860px,94vw);max-height:86vh;display:flex;flex-direction:column;
      background:#1b1b1f;color:#e8e6e0;border:1px solid #3a3a42;border-radius:10px;overflow:hidden;
      box-shadow:0 12px 48px rgba(0,0,0,.5);font-size:14px;}
    #lore-hd{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #3a3a42;flex-wrap:wrap;}
    #lore-hd h3{margin:0;font-size:15px;font-weight:600;flex:0 0 auto;}
    #lore-q{flex:1 1 220px;min-width:160px;padding:7px 10px;border-radius:6px;border:1px solid #4a4a54;
      background:#111;color:#fff;}
    #lore-modal select,#lore-modal button{padding:7px 10px;border-radius:6px;border:1px solid #4a4a54;
      background:#2a2a32;color:#e8e6e0;cursor:pointer;}
    #lore-hd label{display:flex;gap:4px;align-items:center;font-size:12px;opacity:.85;cursor:pointer;}
    #lore-go{background:#3b5bdb;border-color:#3b5bdb;color:#fff;}
    #lore-body{padding:12px;overflow:auto;}
    #lore-answer{white-space:pre-wrap;line-height:1.5;background:#15150f;border:1px solid #4a4626;
      border-radius:6px;padding:12px;margin-bottom:14px;}
    .lore-hit{border:1px solid #33333b;border-radius:6px;padding:8px 10px;margin-bottom:8px;background:#161619;}
    .lore-hit-head{font-size:12px;color:#9fb4e0;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;}
    .lore-score{color:#7a7a86;}
    .lore-hit-text{white-space:pre-wrap;margin:0;font-size:13px;line-height:1.45;max-height:220px;overflow:auto;}
    #lore-status{opacity:.7;font-size:13px;}
  </style>
  <div id="lore-modal">
    <div id="lore-box">
      <div id="lore-hd">
        <h3>🔮 Lore</h3>
        <input id="lore-q" type="text" placeholder="Search Aevorian lore…" autocomplete="off">
        <select id="lore-collection" title="campaign = full canon · novels = firewalled deep-time lore">
          <option value="campaign">Campaign</option>
          <option value="novels">Novels</option>
        </select>
        <label title="Draft a grounded answer with the local LM Studio model"><input id="lore-ask" type="checkbox"> Write</label>
        <button id="lore-go">Search</button>
        <button id="lore-close" title="Close">✕</button>
      </div>
      <div id="lore-body"><div id="lore-status">Type a query and press Enter.</div></div>
    </div>
  </div>
