<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DM Panel — Northwatch Wardens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="tabbar">
    <!-- Mobile-only drawer toggles — grouped at start so they're always visible without scrolling -->
    <button class="mob-btn" id="mob-files" aria-label="Toggle file browser">☰</button>
    <button class="mob-btn" id="mob-term" aria-label="Toggle terminal">⌨</button>

    <nav class="tab-group">
      <button class="tab" data-path="adventures">Adventures</button>
      <button class="tab" data-path="npcs">NPCs</button>
      <button class="tab" data-path="locations">Locations</button>
      <button class="tab" data-path="gm-lore">GM Lore</button>
      <div id="tools-wrap">
        <button id="btn-tools">Tools ▾</button>
      </div>
    </nav>

    <div id="search-wrap">
      <input id="search-input" type="search" placeholder="Search files…" autocomplete="off" spellcheck="false">
    </div>

    <div id="season-wrap">
      <label for="season-sel">Season</label>
      <select id="season-sel">
        <option value="">All</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>

    <div id="breadcrumb" title="Current path"></div>
    <button id="btn-ctx" title="Send file path to terminal" hidden>⌨ Path</button>

    <div id="toast" aria-live="polite"></div>
  </header>

  <!-- Tools dropdown (body-level so it escapes tabbar overflow clipping) -->
  <div id="tools-dropdown" hidden>
    <div class="tools-section">
      <div class="tools-section-label">World Tables</div>
      <div id="tools-world-tables">
        <div class="tool-item" style="color:var(--subtext);cursor:default;font-style:italic">Loading…</div>
      </div>
    </div>
    <div class="tools-section">
      <div class="tools-section-label">SRD Tools</div>
      <button id="tool-random-encounter" class="tool-item">⚔ Random Encounter</button>
      <button id="tool-treasure-hoard" class="tool-item">💰 Treasure Hoard</button>
    </div>
    <div class="tools-section">
      <div class="tools-section-label">5etools</div>
      <button class="tool-item tool-5e" data-5e-url="http://localhost:2014">🎲 5etools</button>
      <button class="tool-item tool-5e" data-5e-url="http://localhost:2014/bestiary.html">🐉 Bestiary</button>
      <button class="tool-item tool-5e" data-5e-url="http://localhost:2014/spells.html">✨ Spells</button>
    </div>
  </div>

  <!-- Backdrop for mobile drawers -->
  <div id="drawer-backdrop"></div>

  <div id="workspace">

    <aside id="panel-left">
      <div class="panel-hdr">Files</div>
      <div id="file-tree"></div>
    </aside>

    <div class="rh" id="rh-l" title="Drag to resize · click ‹ to collapse">
      <button class="cbt" id="cbt-l" aria-label="Toggle file browser">‹</button>
    </div>

    <main id="panel-center">
      <iframe id="viewer" src="about:blank" title="Content viewer"></iframe>
    </main>

    <div class="rh" id="rh-r" title="Drag to resize · click › to collapse">
      <button class="cbt" id="cbt-r" aria-label="Toggle terminal">›</button>
    </div>

    <aside id="panel-right">
      <div class="panel-hdr">Terminal</div>
      <div id="term-wrap"></div>
    </aside>

  </div>

  <!-- Modal overlay (primary) -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title"></span>
        <button class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- Modal overlay (nested, max 2 deep) -->
  <div id="modal2" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title"></span>
        <button class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
