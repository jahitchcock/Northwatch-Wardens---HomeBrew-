<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1e1e2e"/>

  <!-- Crossed swords behind shield -->
  <line x1="5" y1="5" x2="21" y2="26" stroke="#45475a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="3.5" y1="9" x2="9.5" y2="3.5" stroke="#45475a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="27" y1="5" x2="11" y2="26" stroke="#45475a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="28.5" y1="9" x2="22.5" y2="3.5" stroke="#45475a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Torch flame (top centre, sits above the shield) -->
  <path d="M16 1.5 C18.5 4 18.5 7.5 16 9 C13.5 7.5 13.5 4 16 1.5Z" fill="#fab387"/>
  <path d="M16 3 C17.5 5 17 7.5 16 9 C15 7.5 14.5 5 16 3Z" fill="#f9e2af"/>

  <!-- Shield body -->
  <path d="M16 9 L27 13.5 L27 21.5 Q27 28.5 16 31.5 Q5 28.5 5 21.5 L5 13.5 Z"
        fill="#181825" stroke="#cba6f7" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- d20 face (regular pentagon + horizontal divider) -->
  <polygon points="16,14.5 21,18 19.2,23.5 12.8,23.5 11,18"
           fill="none" stroke="#cba6f7" stroke-width="0.9"/>
  <line x1="11" y1="18" x2="21" y2="18" stroke="#cba6f7" stroke-width="0.6" opacity="0.85"/>
</svg>
