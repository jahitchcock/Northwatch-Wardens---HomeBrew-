<!DOCTYPE html>
<html>
<head>
    <title>Pale Sickness & Campaign Maps</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #222; color: #fff; }
        h1 { color: #4da6ff; }
        .category { margin: 20px 0; padding: 15px; background: #333; border-radius: 5px; }
        .category h2 { margin-top: 0; color: #66b3ff; }
        .maps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .map-card { background: #444; padding: 10px; border-radius: 5px; text-align: center; }
        .map-card img { max-width: 100%; height: auto; cursor: pointer; border-radius: 3px; }
        .map-card p { margin: 5px 0 0 0; font-size: 14px; }
        a { color: #4da6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Pale Sickness Adventure & Campaign Maps</h1>
    <p>VTT-ready maps with 1-inch grids. Click to view full size.</p>

    <hr>
    <p><small>Maps generated via image-gen with SDXL Mapcraft LoRA. 96 DPI VTT-ready.</small></p>
</body>
</html>
