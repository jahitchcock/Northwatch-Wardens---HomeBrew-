<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Screen — Northwatch Wardens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+SC:wght@500;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111; color: #e0d8c8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      width: 100vw; height: 100vh; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Content wrapper (fades on transition) ── */
    #content {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s;
    }

    #content.fading { opacity: 0; }

    /* ── Idle ── */
    #view-idle { text-align: center; padding: 40px; }
    #view-idle h1 {
      font-size: clamp(2rem, 6vw, 5rem); color: #c5a56a;
      letter-spacing: 0.05em;
      font-family: 'Palatino Linotype', Palatino, serif;
    }
    #idle-message {
      font-size: clamp(1rem, 2.5vw, 2rem); color: #555;
      margin-top: 1rem; min-height: 1em;
    }

    /* ── Image ── */
    #view-image {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #img-el {
      width: 100vw; height: 100vh;
      object-fit: contain; display: block;
    }
    #img-caption { display: none; }

    /* ── NPC reveal ── */
    #view-npc {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #1a1510 0%, #000 80%);
    }
    #npc-portrait {
      max-width: 55vw; max-height: 85vh;
      object-fit: contain; display: block;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 80px rgba(140,100,40,0.15);
    }
    #npc-name {
      position: absolute; bottom: clamp(24px, 6vh, 60px);
      left: 50%; transform: translateX(-50%);
      font-family: 'Cormorant SC', 'Palatino Linotype', serif;
      font-size: clamp(1.8rem, 5vw, 4rem);
      font-weight: 700; color: #e8d8b0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.5);
      letter-spacing: 0.06em; text-align: center;
      white-space: nowrap;
    }

    /* ── Text ── */
    #view-text { max-width: 80vw; text-align: center; }
    #text-content {
      font-size: clamp(1.5rem, 4vw, 3.5rem); color: #e0d8c8;
      line-height: 1.4; font-family: 'Palatino Linotype', Palatino, serif;
    }

    /* ── Handout ── */
    #view-handout {
      background: #e8d9a8;
      background-image:
        radial-gradient(ellipse at 15% 85%, rgba(80,40,0,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 10%, rgba(60,30,0,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(180,140,60,0.06) 0%, transparent 80%);
      color: #1c0e00;
      padding: clamp(28px, 5vw, 56px) clamp(28px, 5vw, 56px);
      border-radius: 1px;
      max-width: min(620px, 90vw);
      max-height: 90vh; overflow-y: auto;
      font-family: 'Cormorant Garamond', 'Palatino Linotype', serif;
      font-size: clamp(1rem, 1.8vw, 1.18rem);
      line-height: 1.7;
      box-shadow: 2px 3px 0 rgba(0,0,0,.25), 0 14px 50px rgba(0,0,0,.75);
      border-top: 3px solid #7a5820;
      border-left: 1px solid #9a7030;
      border-right: 1px solid #9a7030;
      border-bottom: 3px solid #7a5820;
    }
    #view-handout h1 {
      font-family: 'Cormorant SC', serif;
      font-size: clamp(1.6rem, 4.5vw, 2.8rem);
      font-weight: 700; color: #1c0e00;
      text-align: center; letter-spacing: 0.06em;
      margin: 0.1em 0 0.35em;
      line-height: 1.15;
    }
    #view-handout h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.15rem, 2.6vw, 1.65rem);
      font-weight: 600; font-style: italic;
      color: #2a1400; text-align: center;
      margin: 0.3em 0 0.25em;
    }
    #view-handout h3 {
      font-family: 'Cormorant SC', serif;
      font-size: clamp(0.9rem, 1.8vw, 1.1rem);
      font-weight: 500; color: #2a1400;
      text-align: center; letter-spacing: 0.07em;
      margin: 0.4em 0 0.25em;
    }
    #view-handout p  { margin: 0.5em 0; }
    #view-handout ul { margin: 0.3em 0 0.5em 1.6em; }
    #view-handout li { margin: 0.3em 0; }
    #view-handout strong {
      font-weight: 700; font-variant: small-caps;
      letter-spacing: 0.04em;
    }
    #view-handout em { font-style: italic; }
    #view-handout hr {
      border: none; border-top: 1px solid #8a6420;
      margin: 1.1em 0; opacity: 0.6;
    }

    /* ── Rulebook (full-screen iframe) ── */
    #view-rulebook { position: absolute; inset: 0; }
    #view-rulebook iframe { width: 100%; height: 100%; border: none; }

    /* ── Reconnect indicator ── */
    #reconnect-indicator {
      position: fixed; bottom: 12px; right: 12px;
      background: rgba(0,0,0,.75); color: #666;
      font-size: 11px; padding: 4px 10px; border-radius: 3px;
      display: none; font-family: sans-serif;
    }
    #reconnect-indicator.visible { display: block; }

    .ps-hidden { display: none !important; }
  </style>
</head>
<body>

<div id="content">
  <div id="view-idle">
    <h1>Northwatch Wardens</h1>
    <p id="idle-message"></p>
  </div>

  <div id="view-image" class="ps-hidden">
    <img id="img-el" src="" alt="">
    <div id="img-caption"></div>
  </div>

  <div id="view-npc" class="ps-hidden">
    <img id="npc-portrait" src="" alt="">
    <div id="npc-name"></div>
  </div>

  <div id="view-text" class="ps-hidden">
    <p id="text-content"></p>
  </div>

  <div id="view-handout" class="ps-hidden"></div>

  <div id="view-rulebook" class="ps-hidden">
    <iframe id="rulebook-frame" src="" title="Rulebook page"></iframe>
  </div>

  <div id="view-shop" class="ps-hidden" style="background: #e8d9a8; color: #1c0e00; padding: clamp(12px, 3vw, 40px); border-radius: 1px; max-width: min(700px, 95vw); max-height: 90vh; overflow-y: auto; font-family: 'Cormorant Garamond', serif; font-size: clamp(0.85rem, 1.4vw, 1.1rem); line-height: 1.5; box-shadow: 2px 3px 0 rgba(0,0,0,.25), 0 14px 50px rgba(0,0,0,.75);"></div>

  <div id="view-qrcode" class="ps-hidden" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
    <img id="qr-img" src="" alt="QR Code" style="width: 300px; height: 300px; background: white; padding: 10px;">
    <p style="font-size: 18px; color: #ccc; font-family: serif;">Scan to join</p>
  </div>
</div>

<div id="reconnect-indicator">⚡ reconnecting…</div>

<script>
'use strict';

const views = {
  idle:     document.getElementById('view-idle'),
  image:    document.getElementById('view-image'),
  npc:      document.getElementById('view-npc'),
  text:     document.getElementById('view-text'),
  handout:  document.getElementById('view-handout'),
  rulebook: document.getElementById('view-rulebook'),
  shop:     document.getElementById('view-shop'),
  qrcode:   document.getElementById('view-qrcode'),
};
const content      = document.getElementById('content');
const reconnectEl  = document.getElementById('reconnect-indicator');

// ── HTML escape helper (module scope so title interpolation can use it) ──
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Minimal markdown renderer (headings, bold, italic, lists, hr, code, paragraphs) ──
function renderMd(md) {
  // Strip YAML frontmatter (handles both LF and CRLF)
  md = md.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');

  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,     '<em>$1</em>');
  }
  const lines = md.split('\n');
  let html = '';
  let inList = false;
  let inCode = false;
  let codeBuf = '';
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^```/.test(line)) {
      if (!inCode) { closeList(); inCode = true; codeBuf = ''; }
      else { html += `<pre><code>${esc(codeBuf)}</code></pre>`; inCode = false; }
    } else if (inCode) {
      codeBuf += (codeBuf ? '\n' : '') + raw;
    } else if (/^---+$/.test(line))    { closeList(); html += '<hr>'; }
    else if (/^### (.*)/.test(line))   { closeList(); html += `<h3>${inline(line.slice(4))}</h3>`; }
    else if (/^## (.*)/.test(line))    { closeList(); html += `<h2>${inline(line.slice(3))}</h2>`; }
    else if (/^# (.*)/.test(line))     { closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; }
    else if (/^- (.*)/.test(line))     {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
    }
    else if (line === '') { closeList(); }
    else                  { closeList(); html += `<p>${inline(line)}</p>`; }
  }
  if (inCode) html += `<pre><code>${esc(codeBuf)}</code></pre>`;
  closeList();
  return html;
}

// ── Apply a state object to the screen ────────────────────────────────────────
function applyState(state) {
  content.classList.add('fading');
  setTimeout(() => {
    Object.values(views).forEach(v => v.classList.add('ps-hidden'));

    if (state.type === 'idle') {
      document.getElementById('idle-message').textContent = state.idleMessage || '';
      views.idle.classList.remove('ps-hidden');

    } else if (state.type === 'image') {
      document.getElementById('img-el').src = state.url;
      const cap = document.getElementById('img-caption');
      cap.textContent = state.caption || '';
      cap.style.display = state.caption ? '' : 'none';
      views.image.classList.remove('ps-hidden');

    } else if (state.type === 'npc') {
      document.getElementById('npc-portrait').src = state.url;
      document.getElementById('npc-name').textContent = state.caption || '';
      views.npc.classList.remove('ps-hidden');

    } else if (state.type === 'text') {
      document.getElementById('text-content').textContent = state.content;
      views.text.classList.remove('ps-hidden');

    } else if (state.type === 'handout') {
      const el = views.handout;
      const titleHtml = state.title
        ? `<div class="handout-title">${esc(state.title)}</div>`
        : '';
      el.innerHTML = titleHtml + renderMd(state.markdown);
      el.classList.remove('ps-hidden');

    } else if (state.type === 'rulebook') {
      const params = new URLSearchParams({
        book:  state.bookId,
        page:  String(state.page),
        embed: '1',
      });
      document.getElementById('rulebook-frame').src = `/rulebooks?${params}`;
      views.rulebook.classList.remove('ps-hidden');

    } else if (state.type === 'shop') {
      const titleHtml = state.title ? `<h1 style="font-family: 'Cormorant SC', serif; font-size: clamp(1.2rem, 3.5vw, 2.4rem); font-weight: 700; color: #1c0e00; text-align: center; letter-spacing: 0.06em; margin: 0 0 0.3em; line-height: 1.1; grid-column: 1 / -1;">${esc(state.title)}</h1>` : '';
      const itemsHtml = (state.items || []).map(item => `
        <div style="padding: clamp(8px, 1.5vh, 12px); border: 1px solid #8a6420; background: rgba(255,255,255,0.4);">
          <div style="font-weight: 700; font-size: clamp(0.9rem, 1.1vw, 1.05rem); margin-bottom: clamp(2px, 0.3vh, 4px);">${esc(item.name)}</div>
          ${item.price ? `<div style="color: #7a5820; font-style: italic; font-size: clamp(0.75rem, 0.9vw, 0.9rem); margin-bottom: clamp(4px, 0.7vh, 6px); font-weight: 600;">${esc(item.price)}</div>` : ''}
          ${item.description ? `<div style="margin-bottom: 0; font-size: clamp(0.75rem, 0.85vw, 0.88rem); line-height: 1.2;">${renderMd(item.description)}</div>` : ''}
        </div>
      `).join('');
      const gridHtml = `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(clamp(120px, 40vw, 200px), 1fr)); gap: clamp(8px, 1.5vw, 12px); align-items: start;">${titleHtml}${itemsHtml || '<p>No items available.</p>'}</div>`;
      views.shop.innerHTML = gridHtml;
      views.shop.classList.remove('ps-hidden');

    } else if (state.type === 'qrcode') {
      document.getElementById('qr-img').src = state.dataUrl;
      views.qrcode.classList.remove('ps-hidden');
    }

    content.classList.remove('fading');
  }, 200);
}

// ── WebSocket with auto-reconnect ──────────────────────────────────────────────
let reconnectTimeout = null;

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/player`);

  // Store handler references for cleanup
  const onOpen = () => {
    reconnectEl.classList.remove('visible');
  };

  const onMessage = e => {
    try { applyState(JSON.parse(e.data)); } catch {}
  };

  const onClose = () => {
    reconnectEl.classList.add('visible');
    // Use stored timeout reference for cleanup on page unload
    reconnectTimeout = setTimeout(connect, 3000);
  };

  ws.addEventListener('open', onOpen);
  ws.addEventListener('message', onMessage);
  ws.addEventListener('close', onClose);
}

connect();

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
  if (reconnectTimeout) clearTimeout(reconnectTimeout);
});
</script>
</body>
</html>
