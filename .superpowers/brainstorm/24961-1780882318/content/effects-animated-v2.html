<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VTT Effects v2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1e1e2e; color: #cdd6f4; font-family: 'Segoe UI', sans-serif; padding: 24px; }
  h2 { font-size: 18px; margin-bottom: 6px; color: #cba6f7; }
  .sub { font-size: 12px; color: #a6adc8; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { border-radius: 8px; overflow: hidden; border: 1px solid #313244; }
  .card-label { background: #181825; padding: 8px 12px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #a6adc8; display: flex; align-items: center; gap: 6px; }
  .card-label span { font-size: 14px; }
  .map { position: relative; height: 200px; overflow: hidden; background: linear-gradient(135deg,#2a3a2a 0%,#3a4a3a 30%,#2a3530 60%,#1a2520 100%); }
  .map::before { content:''; position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 29px,rgba(255,255,255,0.04) 30px),repeating-linear-gradient(90deg,transparent,transparent 29px,rgba(255,255,255,0.04) 30px); }

  /* ── RAIN (unchanged) ── */
  @keyframes rain-fall { 0%{transform:translateY(-100%) translateX(0)} 100%{transform:translateY(300%) translateX(-30px)} }
  .raindrop { position:absolute;width:1px;border-radius:1px;background:rgba(180,215,255,0.5);animation:rain-fall linear infinite; }

  /* ── FOG rolling ── */
  .fog-layer { position:absolute;inset:0;pointer-events:none; }
  .fog-patch {
    position: absolute;
    border-radius: 50%;
    filter: blur(32px);
    background: rgba(200,218,232,0.52);
    /* JS drives left/top via transition */
    transition: left 0s linear, top 0s linear;
  }

  /* ── FIRE rolling ── */
  .fire-layer { position:absolute;inset:0;pointer-events:none;overflow:hidden; }
  .fire-hotspot {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    transition: left 0s linear, top 0s linear;
  }
  @keyframes hotspot-pulse {
    0%  { transform: scale(1)    rotate(0deg); opacity: 0.7; }
    25% { transform: scale(1.08) rotate(2deg); opacity: 0.9; }
    50% { transform: scale(0.95) rotate(-2deg); opacity: 0.75; }
    75% { transform: scale(1.05) rotate(1deg); opacity: 0.85; }
    100%{ transform: scale(1)    rotate(0deg); opacity: 0.7; }
  }
  /* ambient warm tint that follows the fire energy */
  @keyframes fire-ambient {
    0%  { opacity: 0.18; }
    33% { opacity: 0.28; }
    66% { opacity: 0.14; }
    100%{ opacity: 0.18; }
  }
  .fire-ambient {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(255,90,0,0.35) 0%, transparent 70%);
    animation: fire-ambient 3s ease-in-out infinite;
    pointer-events: none;
  }
</style>
</head>
<body>
  <h2>VTT Effects — Fire &amp; Fog Rolling</h2>
  <p class="sub">Fire patches and fog banks now roam the map. Rain and snow unchanged.</p>

  <div class="grid">

    <!-- FOG rolling -->
    <div class="card">
      <div class="card-label"><span>🌫</span> Fog — rolling across map</div>
      <div class="map" id="fog-map">
        <div class="fog-layer" id="fog-layer"></div>
      </div>
    </div>

    <!-- FIRE rolling -->
    <div class="card">
      <div class="card-label"><span>🔥</span> Fire — roaming hotspots</div>
      <div class="map" id="fire-map">
        <div class="fire-layer" id="fire-layer">
          <div class="fire-ambient"></div>
        </div>
      </div>
    </div>

    <!-- RAIN (reference) -->
    <div class="card">
      <div class="card-label"><span>🌧</span> Rain — unchanged</div>
      <div class="map"><div id="rain-layer" style="position:absolute;inset:-20px"></div></div>
    </div>

    <!-- SNOW (reference) -->
    <div class="card">
      <div class="card-label"><span>❄️</span> Snow — unchanged</div>
      <div class="map"><div id="snow-layer" style="position:absolute;inset:0"></div></div>
    </div>

  </div>

<script>
/* ── FOG: multiple large patches drifting with random walks ── */
(function() {
  const layer = document.getElementById('fog-layer');
  const map   = document.getElementById('fog-map');
  const W = () => map.offsetWidth;
  const H = () => map.offsetHeight;

  const patches = [];
  const COUNT = 5;
  for (let i = 0; i < COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'fog-patch';
    const size = 120 + Math.random() * 140;
    el.style.width  = size + 'px';
    el.style.height = (size * 0.55) + 'px';
    el.style.opacity = (0.45 + Math.random() * 0.35).toFixed(2);
    layer.appendChild(el);

    // start scattered across map including off-edges
    patches.push({
      el,
      x: Math.random() * 1.4 - 0.2,   // fraction of map width (can be off-edge)
      y: Math.random() * 1.2 - 0.1,
      vx: (Math.random() - 0.5) * 0.0006,  // velocity per ms, fraction of map
      vy: (Math.random() - 0.5) * 0.0003,
      size,
    });
    el.style.left = (patches[i].x * 100) + '%';
    el.style.top  = (patches[i].y * 100) + '%';
  }

  let last = null;
  function tick(ts) {
    if (!last) last = ts;
    const dt = Math.min(ts - last, 50);
    last = ts;

    for (const p of patches) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // gently nudge velocity (random walk)
      p.vx += (Math.random() - 0.5) * 0.000015;
      p.vy += (Math.random() - 0.5) * 0.000010;

      // clamp velocity
      const maxV = 0.0008;
      p.vx = Math.max(-maxV, Math.min(maxV, p.vx));
      p.vy = Math.max(-maxV * 0.5, Math.min(maxV * 0.5, p.vy));

      // wrap around when fully off-screen
      if (p.x > 1.3)  p.x = -p.size / W();
      if (p.x < -p.size / W() - 0.1) p.x = 1.2;
      if (p.y > 1.2)  p.y = -p.size / H();
      if (p.y < -p.size / H() - 0.1) p.y = 1.1;

      p.el.style.left = (p.x * 100) + '%';
      p.el.style.top  = (p.y * 100) + '%';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ── FIRE: roaming hotspots with pulsing glow ── */
(function() {
  const layer = document.getElementById('fire-layer');
  const map   = document.getElementById('fire-map');

  const spots = [];
  const SPOT_COUNT = 4;

  for (let i = 0; i < SPOT_COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'fire-hotspot';

    const size = 60 + Math.random() * 80;
    el.style.width  = size + 'px';
    el.style.height = size + 'px';
    el.style.marginLeft = -(size/2) + 'px';
    el.style.marginTop  = -(size/2) + 'px';

    // colour varies per hotspot: orange, red, deep orange
    const hues = ['rgba(255,110,0,', 'rgba(255,50,0,', 'rgba(255,160,20,'];
    const hue  = hues[i % hues.length];
    el.style.background = `radial-gradient(circle, ${hue}0.75) 0%, ${hue}0.35) 40%, transparent 75%)`;
    el.style.animation  = `hotspot-pulse ${1.2 + Math.random() * 1.4}s ease-in-out infinite`;
    el.style.animationDelay = -(Math.random() * 2) + 's';
    layer.appendChild(el);

    spots.push({
      el, size,
      x: 0.15 + Math.random() * 0.7,
      y: 0.15 + Math.random() * 0.7,
      vx: (Math.random() - 0.5) * 0.0005,
      vy: (Math.random() - 0.5) * 0.0005,
    });
    el.style.left = (spots[i].x * 100) + '%';
    el.style.top  = (spots[i].y * 100) + '%';
  }

  let last = null;
  function tick(ts) {
    if (!last) last = ts;
    const dt = Math.min(ts - last, 50);
    last = ts;

    for (const s of spots) {
      s.x += s.vx * dt;
      s.y += s.vy * dt;

      // random walk nudge
      s.vx += (Math.random() - 0.5) * 0.000025;
      s.vy += (Math.random() - 0.5) * 0.000025;

      // clamp velocity
      const maxV = 0.0007;
      s.vx = Math.max(-maxV, Math.min(maxV, s.vx));
      s.vy = Math.max(-maxV, Math.min(maxV, s.vy));

      // bounce off edges
      if (s.x < 0.05) { s.x = 0.05; s.vx = Math.abs(s.vx); }
      if (s.x > 0.95) { s.x = 0.95; s.vx = -Math.abs(s.vx); }
      if (s.y < 0.05) { s.y = 0.05; s.vy = Math.abs(s.vy); }
      if (s.y > 0.95) { s.y = 0.95; s.vy = -Math.abs(s.vy); }

      s.el.style.left = (s.x * 100) + '%';
      s.el.style.top  = (s.y * 100) + '%';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ── RAIN ── */
(function() {
  const layer = document.getElementById('rain-layer');
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div');
    d.className = 'raindrop';
    d.style.cssText = `left:${Math.random()*120}%;top:${Math.random()*100}%;height:${8+Math.random()*12}px;opacity:${0.3+Math.random()*0.5};animation:rain-fall ${0.4+Math.random()*0.4}s linear ${-(Math.random()*1.2)}s infinite`;
    layer.appendChild(d);
  }
})();

/* ── SNOW ── */
(function() {
  const layer = document.getElementById('snow-layer');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    const size = 2 + Math.random() * 3;
    s.style.cssText = `position:absolute;border-radius:50%;background:rgba(220,240,255,0.9);width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${-size}px;opacity:${0.5+Math.random()*0.5};animation:rain-fall ${2+Math.random()*3}s ease-in ${-(Math.random()*5)}s infinite`;
    layer.appendChild(s);
  }
})();
</script>
</body>
</html>
